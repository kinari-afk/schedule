  <style>
    /* 画面回転時のテキストサイズ自動調整を防止 */

    /* スムーズなスクロール */
    .hide-scrollbar::-webkit-scrollbar { display: none; }

    button, select, input { touch-action: manipulation; }
    
    /* モバイルでの入力時ズーム防止（フォントサイズ16px以上） */

      input, select, textarea { font-size: 16px !important; }

    /* 印刷・PDF用：画面用の表示を隠し、印刷専用の表だけを出す */
    .print-only { display: none; }
    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      html, body { background: #fff !important; }
      .app-shell { height: auto !important; overflow: visible !important; display: block !important; background: #fff !important; }
      .app-shell > *:not(.print-only) { display: none !important; }

      .print-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44mm, 1fr)); gap: 3mm; }
      .print-box { border: 0.3mm solid #666; border-radius: 1.5mm; break-inside: avoid; page-break-inside: avoid; overflow: hidden; }

      .print-note { font-size: 7.5pt; color: #333; white-space: pre-wrap; }
      .print-empty { padding: 1.5mm 2mm; font-size: 8pt; color: #666; }
    }

    /* スマホのアドレスバー分を除いた「実際に見えている高さ」に合わせる */

    .glass-effect { backdrop-filter: blur(8px); background-color: rgba(255, 255, 255, 0.8); }

<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useMemo, useRef, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Calendar, Users, Map as MapIcon, Clock, MapPin, RefreshCw, Plus, Trash2, ArrowRight, ArrowDown, CheckCircle2, UserPlus, Activity, Upload, AlertTriangle, CalendarDays, Link as LinkIcon, UserCog, Columns, Settings2, ChevronUp, ChevronDown, ArrowUpDown, ChevronRight, ChevronLeft, ChevronsLeft, ChevronsRight, Undo, Lock, Unlock, Briefcase, X, BarChart3, Pencil, MessageSquare, Copy, RotateCcw, MoreVertical, History, Download, Database, Archive, LogIn, LogOut, Navigation, ShieldAlert, WifiOff, Printer, HelpCircle, ListChecks, Coffee } from 'lucide-react';
    
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, setDoc, getDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
    import * as _LZ from 'https://esm.sh/lz-string@1.5.0';
    const LZString = (_LZ && _LZ.default && _LZ.default.compressToBase64) ? _LZ.default : _LZ;

    // 大きなフィールド（visits / savedPatterns）を圧縮して保存し、
    // Firestoreの「1ドキュメント約1MB」上限に引っかからないようにする。
    const COMPRESS_PREFIX = 'LZ:';
    const encodeField = (obj) => {
      const json = JSON.stringify(obj);
      try {
        if (LZString && typeof LZString.compressToBase64 === 'function') {
          return COMPRESS_PREFIX + LZString.compressToBase64(json);
        }
      } catch (e) { console.error("compress failed:", e); }
      return json; // 圧縮不可のときは従来どおり素のJSONで保存
    };
    const decodeField = (str, fallback) => {
      if (str == null) return fallback;
      try {
        if (typeof str === 'string' && str.startsWith(COMPRESS_PREFIX)) {
          const json = LZString.decompressFromBase64(str.slice(COMPRESS_PREFIX.length));
          return json ? JSON.parse(json) : fallback;
        }
        return JSON.parse(str); // 旧形式（非圧縮のJSON文字列）
      } catch (e) {
        console.error("decodeField failed:", e);
        return fallback;
      }
    };

    const myFirebaseConfig = {
      apiKey: "AIzaSyBQFSkTTh582w-WwlfU6mwejs8rPAGrm8M",
      authDomain: "care-route-app.firebaseapp.com",
      projectId: "care-route-app",
      storageBucket: "care-route-app.firebasestorage.app",
      messagingSenderId: "1086680205439",
      appId: "1:1086680205439:web:d0a6a39a25555b7ae3174a"
    };

    let app, auth, db, appId;
    try {
      const envFirebaseConfig = typeof window.__firebase_config !== 'undefined' ? window.__firebase_config : null;
      if (envFirebaseConfig) {
        const firebaseConfig = typeof envFirebaseConfig === 'string' ? JSON.parse(envFirebaseConfig) : envFirebaseConfig;
        app = initializeApp(firebaseConfig);
        appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'default-app-id';
      } else {
        app = initializeApp(myFirebaseConfig);
        appId = myFirebaseConfig.projectId;
      }
      if (app) {
        auth = getAuth(app);
        // 読み込んだデータを端末にも保存しておく（電波がない場所でも、最後に読み込んだ内容を表示できる）
        try {
          db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
        } catch (e) {
          console.warn("端末への保存を有効にできなかったため、通常の方式で接続します", e);
          db = getFirestore(app);
        }
      }
    } catch (e) { console.error("Firebase init error", e); }

    // アプリ本体（このページと、表示に必要な部品）を端末に保存する仕組みを登録する
    if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('sw.js').catch(e => console.warn("オフライン用の保存を登録できませんでした", e));
    }

    /*__PURE_HELPERS_START__*/
    const START_HOUR = 7;
    const END_HOUR = 22;
    const PIXELS_PER_MINUTE = 2.0; 
    const getTop = (minutes) => (minutes - START_HOUR * 60) * PIXELS_PER_MINUTE;

    const parseTime = (timeStr) => {
      if (!timeStr) return 0;
      const parts = timeStr.split(':');
      return parseInt(parts[0]) * 60 + parseInt(parts[1]);
    };

    const formatTime = (minutes) => {
      if (isNaN(minutes)) return "00:00";
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    };

    const normalizeName = (name) => name?.replace(/[\s　]/g, '').replace(/様$/, '') || "";
    const getHashLoc = (str) => {
      let hash = 0;
      for (let i = 0; i < str.length; i++) { hash = str.charCodeAt(i) + ((hash << 5) - hash); }
      return { x: Math.abs(hash % 80) + 10, y: Math.abs((hash >> 3) % 80) + 10 };
    };

    const DISPLAY_DAYS = ['月', '火', '水', '木', '金', '土', '日'];
    const JS_DAYS = ['日', '月', '火', '水', '木', '金', '土'];

    const colors = ['#0ea5e9', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#ef4444', '#14b8a6'];

    // スプレッドシートのURLはコードに書かない（このファイルは誰でも見られるため）。
    // 管理者が「接続設定」に入力したURLがデータベースに保存され、それを使う。
    const DEFAULT_USER_SHEET_URL = "";
    const DEFAULT_NURSE_SHEET_URL = "";

    // ===== セキュリティ設定 =====
    // false: URLを知っている人は誰でも閲覧できる（従来どおり）／ true: 閲覧にもログインが必要
    const REQUIRE_LOGIN_TO_VIEW = false;
    // 管理者として扱うメールアドレス（小文字）。空のときは「ログインした人は全員が管理者」。
    // 閲覧専用の共有アカウントを作る場合は、ここに管理者のアドレスだけを書く。
    const ADMIN_EMAILS = [];

    // ===== データ保管の設定 =====
    const ARCHIVE_KEEP_MONTHS = 6;        // 今月を含めて何か月分を「すぐ編集できる場所」に残すか
    const DEFAULT_TRAVEL_SPEED_KMH = 20;  // 距離から移動時間を計算するときの平均時速
    const ROAD_FACTOR = 1.3;              // 直線距離 → 道のりへの換算係数

    const formatDateLabel = (dateStr) => {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      return `${d.getMonth() + 1}/${d.getDate()}(${JS_DAYS[d.getDay()]})`;
    };

    const isNurseOff = (nurse, dateStr) => {
      if (!nurse || !dateStr) return false;
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return false;
      const jsDayOfWeek = d.getDay();
      
      if (nurse.offDays && nurse.offDays.includes(jsDayOfWeek)) return true;
      if (nurse.specificOffDays && nurse.specificOffDays.includes(dateStr)) return true;
      
      return false;
    };

    const getTodayStr = () => {
      const d = new Date();
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().split('T')[0];
    };
    
    const getMondayStr = (dateStr) => {
      const d = new Date(dateStr);
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      return d.toISOString().split('T')[0];
    };

    // ============================================================
    // ここから下は「画面の状態に依存しない純粋な計算」をまとめたもの。
    // 入力が同じなら必ず同じ結果になるので、単体でテストできる。
    // ============================================================
    // --- CSVの読み取り ---
    // 単純にカンマで区切ると、住所などにカンマが含まれるとき列がずれてしまう。
    // CSVの決まり（"…" で囲まれた中のカンマ・改行は区切りではない、"" は " 1文字）に従って読む。
    const parseCsv = (text) => {
      const rows = [];
      let row = [], field = '', inQuotes = false;
      const src = String(text ?? '').replace(/^\uFEFF/, '');
      for (let i = 0; i < src.length; i++) {
        const c = src[i];
        if (inQuotes) {
          if (c === '"') {
            if (src[i + 1] === '"') { field += '"'; i++; }
            else inQuotes = false;
          } else field += c;
        } else if (c === '"' && field === '') {
          inQuotes = true;
        } else if (c === ',') {
          row.push(field); field = '';
        } else if (c === '\n' || c === '\r') {
          if (c === '\r' && src[i + 1] === '\n') i++;
          row.push(field); field = '';
          rows.push(row); row = [];
        } else field += c;
      }
      if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }
      return rows;
    };
    // 取得した内容がCSVではなくWebページ（エラー画面やログイン画面）だった場合を見分ける
    const looksLikeHtml = (text) => /^\s*<(!doctype|html|head|body)/i.test(String(text ?? ''));

    // --- 編成の設定（管理者が画面から変更でき、データベースに保存される） ---
    const DEFAULT_SETTINGS = {
      amOffStart: '13:30',   // 午前休の人が出勤する時刻
      pmOffEnd: '12:30',     // 午後休の人が退勤する時刻
      lunch: { enabled: true, from: '11:30', to: '13:30', minutes: 60 }   // 昼休憩：この時間帯の中に、連続した空き時間を確保する
    };
    const normalizeSettings = (raw) => {
      const r = raw && typeof raw === 'object' ? raw : {};
      const isTime = (t) => typeof t === 'string' && /^\d{1,2}:\d{2}$/.test(t);
      const lunch = r.lunch && typeof r.lunch === 'object' ? r.lunch : {};
      const minutes = parseInt(lunch.minutes, 10);
      return {
        amOffStart: isTime(r.amOffStart) ? r.amOffStart : DEFAULT_SETTINGS.amOffStart,
        pmOffEnd: isTime(r.pmOffEnd) ? r.pmOffEnd : DEFAULT_SETTINGS.pmOffEnd,
        lunch: {
          enabled: typeof lunch.enabled === 'boolean' ? lunch.enabled : DEFAULT_SETTINGS.lunch.enabled,
          from: isTime(lunch.from) ? lunch.from : DEFAULT_SETTINGS.lunch.from,
          to: isTime(lunch.to) ? lunch.to : DEFAULT_SETTINGS.lunch.to,
          minutes: minutes >= 10 && minutes <= 180 ? minutes : DEFAULT_SETTINGS.lunch.minutes
        }
      };
    };
    // その日の勤務時間（分）。半休のときは、設定した時刻で区切る
    const workWindow = (nurse, offType, settings) => {
      const st = settings || DEFAULT_SETTINGS;
      let startMin = parseTime(nurse.startTime);
      let endMin = parseTime(nurse.endTime || '17:30');
      if (offType === 'AM') startMin = Math.max(startMin, parseTime(st.amOffStart));
      else if (offType === 'PM') endMin = Math.min(endMin, parseTime(st.pmOffEnd));
      return { startMin, endMin };
    };
    // 昼休憩を取れる状態か。busy は [{start, end}]（その看護師の予定）。
    // 昼の時間帯と勤務時間が重なる範囲の中に、決めた分数以上の連続した空きがあれば true
    const hasLunchGap = (busy, startMin, endMin, lunch) => {
      const from = Math.max(parseTime(lunch.from), startMin), to = Math.min(parseTime(lunch.to), endMin);
      if (to - from < lunch.minutes) return true;   // そもそも昼の時間帯に勤務していない（半休など）→ 対象外
      let cursor = from;
      const sorted = busy.filter(b => b.end > from && b.start < to).sort((a, b) => a.start - b.start);
      for (const b of sorted) {
        if (b.start - cursor >= lunch.minutes) return true;
        cursor = Math.max(cursor, b.end);
      }
      return to - cursor >= lunch.minutes;
    };

    // --- 負担の集計 ---
    // 1人・1日分のスケジュール（移動時間を計算済みの予定の並び）から、時間の内訳を出す
    const computeWorkload = (sch) => {
      if (!sch || sch.isOff) return null;
      const list = sch.visits || [];
      let visitCount = 0, visitMin = 0, otherMin = 0, travelMin = 0;
      list.forEach(v => {
        if (v.type === 'other') otherMin += v.duration || 0;
        else { visitCount++; visitMin += v.duration || 0; }
        travelMin += v.travelTime || 0;
      });
      if (list.length > 0) travelMin += sch.finalTravelTime || 0;   // 最後の訪問先から戻る分
      const spanMin = Math.max(0, (sch.workEndTimeMin ?? 0) - parseTime(sch.workStartTimeStr));
      const totalMin = visitMin + otherMin + travelMin;
      const overtimeMin = list.length > 0 ? Math.max(0, parseTime(sch.returnTime) - (sch.workEndTimeMin ?? 0)) : 0;
      return { visitCount, visitMin, otherMin, travelMin, totalMin, spanMin, ratio: spanMin > 0 ? totalMin / spanMin : 0, overtimeMin, noLunch: !!sch.noLunch };
    };
    const formatHM = (min) => `${Math.floor(min / 60)}:${String(Math.round(min % 60)).padStart(2, '0')}`;

    // --- 割り当てできない理由 ---
    // この予定をこの看護師に、この開始時刻で割り当てられない場合に、その理由を返す（問題なければ null）
    const assignProblem = (visit, nurse, offType, startMin, settings) => {
      const st = settings || DEFAULT_SETTINGS;
      if (!nurse) return null;
      if (visit.requiresFemaleNurse && !nurse.isFemale) return "この利用者は女性看護師限定です";
      const excluded = visit.excludedNurseNames || [];
      if (excluded.some(ex => ex && (nurse.name.includes(ex) || ex.includes(nurse.name)))) return "除外スタッフに設定されているため、割り当てできません";
      if (offType === 'full') return `${nurse.name} は本日お休みです`;
      if (offType === 'AM' && startMin < parseTime(st.amOffStart)) return `${nurse.name} は午前休（${st.amOffStart}以降出勤）です`;
      if (offType === 'PM' && startMin >= parseTime(st.pmOffEnd)) return `${nurse.name} は午後休（${st.pmOffEnd}退勤）です`;
      return null;
    };
    // 同じ看護師の、時間が重なる予定を探す
    const findOverlap = (visits, visit, nurseId, date, startMin) => {
      const endMin = startMin + (visit.duration || 30);
      return visits.find(o => o.id !== visit.id && o.date === date && o.nurseId === nurseId
        && parseTime(o.startTime) < endMin && startMin < parseTime(o.startTime) + (o.duration || 30)) || null;
    };

    // --- 同行訪問の連動 ---
    // 同行用の予定（isAccompany）が、どの予定に付いているかを探す
    const findAccompanyParent = (accompany, list) => {
      if (accompany.accompanyOf != null) return list.find(v => v.id === accompany.accompanyOf) || null;
      // 以前のバージョンで作った同行予定には紐づけ情報がないので、「同じ利用者・同じ日・同じ時刻」で探す
      const name = normalizeName(accompany.userName);
      return list.find(v => v.id !== accompany.id && !v.isAccompany && v.type !== 'other'
        && v.date === accompany.date && v.startTime === accompany.startTime && normalizeName(v.userName) === name) || null;
    };
    // 予定の一覧が prev → next に変わるとき、元の予定の変更を同行予定にも反映する。
    //  ・元の予定の時刻・日付・所要時間が変わった → 同行予定も同じだけ動かす
    //  ・元の予定が削除された                     → 同行予定も削除する
    //  ・同行予定そのものを同時に動かしている場合は、その操作を優先して何もしない
    const syncAccompanyVisits = (prev, next) => {
      if (!next.some(v => v.isAccompany)) return next;
      const prevById = new Map(prev.map(v => [v.id, v]));
      const nextById = new Map(next.map(v => [v.id, v]));
      let changed = false;
      const result = [];
      next.forEach(a => {
        if (!a.isAccompany) { result.push(a); return; }
        const aPrev = prevById.get(a.id);
        if (!aPrev) { result.push(a); return; }                       // いま作られたばかり
        const parentPrev = findAccompanyParent(aPrev, prev);
        if (!parentPrev) { result.push(a); return; }
        const parentNext = nextById.get(parentPrev.id);
        if (!parentNext) { changed = true; return; }                  // 元の予定が削除された
        const selfMoved = a.startTime !== aPrev.startTime || a.date !== aPrev.date || a.duration !== aPrev.duration;
        const parentMoved = parentNext.startTime !== parentPrev.startTime || parentNext.date !== parentPrev.date || parentNext.duration !== parentPrev.duration;
        if (selfMoved || !parentMoved) {
          // 紐づけ情報がまだ無ければ、この機会に記録しておく
          if (a.accompanyOf == null) { changed = true; result.push({ ...a, accompanyOf: parentPrev.id }); } else result.push(a);
          return;
        }
        const delta = parseTime(parentNext.startTime) - parseTime(parentPrev.startTime);
        const newStart = formatTime(Math.max(0, Math.min(24 * 60 - 5, parseTime(a.startTime) + delta)));
        changed = true;
        result.push({
          ...a,
          accompanyOf: parentPrev.id,
          date: parentNext.date,
          startTime: newStart,
          originalStartTime: parentNext.originalStartTime || a.originalStartTime,
          duration: a.duration === parentPrev.duration ? parentNext.duration : a.duration
        });
      });
      return changed ? result : next;
    };

    // --- 移動時間の計算 ---
    // 住所の表記ゆれ（空白・全角数字・ハイフンの種類）をそろえる
    const normalizeAddress = (addr) => (addr || '')
      .replace(/[\s　]/g, '')
      .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .replace(/[－‐−–—]/g, '-')
      .replace(/(\d)ー(?=\d)/g, '$1-');
    // 住所から「町名まで」を取り出す。 例: 東京都○○区緑町1-2-3 → 東京都○○区緑町
    const areaKeyOf = (addr) => {
      const key = normalizeAddress(addr).split(/[0-9]|[一二三四五六七八九十]+丁目/)[0];
      return key || null;
    };
    const haversineKm = (a, b) => {
      const rad = (d) => d * Math.PI / 180;
      const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
      return 6371 * 2 * Math.asin(Math.sqrt(h));
    };
    const isValidLatLng = (lat, lng) => typeof lat === 'number' && typeof lng === 'number' && !isNaN(lat) && !isNaN(lng) && lat >= 20 && lat <= 46 && lng >= 122 && lng <= 154;
    // 予定や看護師（{location, address}）から「地点」を作る関数を返す。
    // 優先順位: シートの緯度経度 → 住所から取得済みの緯度経度(geoCache) → 町名
    const makePointOf = (geoCache) => (obj) => {
      const loc = obj?.location;
      const area = areaKeyOf(obj?.address);
      if (loc && isValidLatLng(loc.lat, loc.lng)) return { lat: loc.lat, lng: loc.lng, area };
      const hit = geoCache ? geoCache[normalizeAddress(obj?.address)] : null;
      if (Array.isArray(hit) && isValidLatLng(hit[0], hit[1])) return { lat: hit[0], lng: hit[1], area };
      return { area };
    };
    // 2地点間の移動時間（分）。基本の移動時間に、距離に応じた時間を足す。
    //  ・両方の緯度経度が分かる → 直線距離×道のり係数÷時速
    //  ・町名だけ分かる         → 同じ町名なら +0分、違えば +4分
    //  ・どちらか不明           → +2分
    const travelMinutes = (a, b, base, speedKmh) => {
      if (a && b && a.lat != null && b.lat != null) return base + Math.round(haversineKm(a, b) * ROAD_FACTOR / (speedKmh || DEFAULT_TRAVEL_SPEED_KMH) * 60);
      if (a && b && a.area && b.area) return base + (a.area === b.area ? 0 : 4);
      return base + 2;
    };
    const monthOf = (dateStr) => (dateStr || '').slice(0, 7);

    // 日付文字列を必ず YYYY-MM-DD（ゼロ埋め）にそろえる。 例: 2026/4/5 → 2026-04-05
    const normalizeDateStr = (raw) => {
      if (!raw) return '';
      const parts = String(raw).trim().replace(/\//g, '-').split('-');
      if (parts.length !== 3) return String(raw).trim().replace(/\//g, '-');
      return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
    };

    // 担当者が決まっていない予定か？（担当者が名簿から消えている場合も「未割り当て」とみなす）
    const isVisitUnassigned = (v, nurseIdSet) => v.nurseId == null || !nurseIdSet.has(v.nurseId);

    // 過去の担当実績を集計する。
    // 利用者ごとに「どの看護師が何回訪問したか」を数え、同じ曜日の実績は2倍に重み付けする。
    const HISTORY_WINDOW_DAYS = 120;
    const buildAssignHistory = (visits, nurseIdSet, date) => {
      const map = new Map();
      const target = new Date(date);
      if (isNaN(target.getTime())) return map;
      const targetDow = target.getDay();
      const from = new Date(date);
      from.setDate(from.getDate() - HISTORY_WINDOW_DAYS);
      const fromStr = from.toISOString().split('T')[0];
      visits.forEach(v => {
        if (!v.date || v.date >= date || v.date < fromStr) return;
        if (v.nurseId == null || !nurseIdSet.has(v.nurseId)) return;
        if (v.type === 'other' || v.isAccompany) return;
        const key = normalizeName(v.userName);
        if (!key) return;
        const w = new Date(v.date).getDay() === targetDow ? 2 : 1;
        let e = map.get(key);
        if (!e) { e = { total: 0, byNurse: {} }; map.set(key, e); }
        e.total += w;
        e.byNurse[v.nurseId] = (e.byNurse[v.nurseId] || 0) + w;
      });
      return map;
    };

    // ===== 自動編成 =====
    //  ・看護師ごとに「その日の予定の並び」を持ち、新しい訪問が「空き時間に収まるか」で判定する
    //    （＝後ろの時間に予定が入っていても、その前の空き時間を使える／ダブルブッキングはしない）
    //  ・収まる候補が複数いるときは「負担の少なさ・午前午後のバランス・移動の少なさ・過去の担当実績」の合計点で選ぶ

    // 看護師ごとの「その日の状態」を作る
    const buildNurseStates = ({ visits, nurses, date, offTypeOf, pointOf, settings }) => {
      const states = [];
      nurses.forEach(n => {
        const offType = offTypeOf(n);
        if (offType === 'full') { states.push({ nurse: n, offType, isOff: true }); return; }
        const { startMin, endMin } = workWindow(n, offType, settings);
        const s = { nurse: n, offType, isOff: false, startMin, endMin, items: [], total: 0, am: 0, pm: 0, home: pointOf({ location: n.startLocation, address: n.address }) };
        visits.forEach(v => {
          if (v.date !== date || v.nurseId !== n.id) return;
          const start = parseTime(v.startTime), dur = v.duration || 30;
          s.items.push({ start, end: start + dur, visit: v });
          s.total += dur;
          if (start < 12 * 60) s.am += dur; else s.pm += dur;
        });
        s.items.sort((a, b) => a.start - b.start);
        states.push(s);
      });
      return states;
    };

    const nurseNameMatches = (nurseName, target) => !!nurseName && !!target && (nurseName === target || nurseName.includes(target) || target.includes(nurseName));

    // 割り当ての「無理のなさ」の段階（数字が小さいほど良い）
    const FIT_LABELS = {
      1: null,
      2: '昼休憩が取れなくなります',
      3: '前後の移動時間に余裕がありません',
      4: '移動時間に余裕がなく、昼休憩も取れなくなります',
      5: '勤務時間を超えます（時間外）'
    };
    // 割り当てられない理由
    const REJECT_LABELS = {
      off: 'お休み', female: '女性限定のため対象外', excluded: '除外スタッフ',
      before: '出勤前の時間', after: '退勤後の時間', overlap: '別の予定と時間が重なる'
    };

    // 1人の看護師について、この訪問を入れられるかを判定する。
    // 入れられる → { ok: true, level, detour } ／ 入れられない → { ok: false, code, detail }
    const classifyFit = (s, v, { pointOf, travelBetween, settings }) => {
      const st = settings || DEFAULT_SETTINGS;
      const excluded = v.excludedNurseNames || [];
      if (excluded.some(ex => nurseNameMatches(s.nurse.name, ex))) return { ok: false, code: 'excluded' };
      if (v.requiresFemaleNurse && !s.nurse.isFemale) return { ok: false, code: 'female' };
      if (s.isOff) return { ok: false, code: 'off' };
      const travelTo = (fromPt, target) => target.customTravelTime ?? travelBetween(fromPt, pointOf(target));
      const start = parseTime(v.startTime), dur = v.duration || 30, end = start + dur;
      if (start < s.startMin) return { ok: false, code: 'before' };
      if (start >= s.endMin) return { ok: false, code: 'after' };
      let prev = null, next = null;
      for (const it of s.items) { if (it.start <= start) prev = it; else { next = it; break; } }
      if (prev && prev.end > start) return { ok: false, code: 'overlap', detail: prev.visit.userName };
      if (next && next.start < end) return { ok: false, code: 'overlap', detail: next.visit.userName };
      const overtime = end > s.endMin;
      if (overtime && s.offType !== 'work') return { ok: false, code: 'after' };   // 半休の人には時間外を頼まない

      const prevLoc = prev ? pointOf(prev.visit) : s.home;
      const prevEnd = prev ? prev.end : s.startMin;
      const tIn = travelTo(prevLoc, v);
      const tOut = next ? travelTo(pointOf(v), next.visit) : 0;
      const tight = prevEnd + tIn > start || (!!next && end + tOut > next.start);

      let lunchOk = true;
      if (st.lunch.enabled && s.offType === 'work') {
        const busy = s.items.map(it => ({ start: it.start, end: it.end }));
        const had = hasLunchGap(busy, s.startMin, s.endMin, st.lunch);
        // すでに昼休憩が取れない状態の人は、これ以上悪くならないので問題なしとみなす
        lunchOk = !had || hasLunchGap([...busy, { start, end }], s.startMin, s.endMin, st.lunch);
      }
      const level = overtime ? 5 : (!tight && lunchOk) ? 1 : !tight ? 2 : lunchOk ? 3 : 4;
      return { ok: true, level, detour: tIn + (next ? tOut - travelTo(prevLoc, next.visit) : 0) };
    };

    // ある予定について、看護師全員の「入れられる／入れられない理由」を一覧にする（画面の説明用）
    const explainVisit = (opts, visit) => {
      const states = buildNurseStates({ ...opts, visits: opts.visits.filter(v => v.id !== visit.id) });
      return states.map(s => {
        const fit = classifyFit(s, visit, opts);
        return fit.ok
          ? { nurse: s.nurse, ok: true, level: fit.level, label: FIT_LABELS[fit.level] }
          : { nurse: s.nurse, ok: false, code: fit.code, label: REJECT_LABELS[fit.code] + (fit.detail ? `（${fit.detail}）` : '') };
      });
    };
    // 「なぜ誰にも入らないのか」を1行にまとめる。 例: 時間が重なる 3名 ／ お休み 1名
    const summarizeRejections = (rows) => {
      const counts = {};
      rows.filter(r => !r.ok).forEach(r => { counts[r.code] = (counts[r.code] || 0) + 1; });
      const order = ['overlap', 'before', 'after', 'off', 'female', 'excluded'];
      return order.filter(c => counts[c]).map(c => `${REJECT_LABELS[c]} ${counts[c]}名`).join(' ／ ');
    };

    const planAutoAssign = ({ visits, nurses, date, offTypeOf, pointOf, travelBetween, history, settings }) => {
      const opts = { pointOf, travelBetween, settings: settings || DEFAULT_SETTINGS };
      const nurseIdSet = new Set(nurses.map(n => n.id));
      const states = buildNurseStates({ visits, nurses, date, offTypeOf, pointOf, settings: opts.settings });

      const scoreOf = (s, v, fit) => {
        const start = parseTime(v.startTime), dur = v.duration || 30;
        const span = Math.max(60, s.endMin - s.startMin);
        const isAM = start < 12 * 60;
        let score = ((s.total + dur) / span) * 100;                       // 勤務時間に対する負担率
        score += ((isAM ? s.am - s.pm : s.pm - s.am) / span) * 30;        // 午前・午後のかたより
        score += fit.detour;                                               // 増える移動時間（分）
        let historyNote = null;
        if (history && v.type !== 'other' && !v.isAccompany) {
          const h = history.get(normalizeName(v.userName));
          const cnt = h ? (h.byNurse[s.nurse.id] || 0) : 0;
          if (cnt > 0) {
            score -= (cnt / h.total) * Math.min(1, h.total / 3) * 30;     // なじみの看護師を優先
            historyNote = `過去の担当実績（この利用者の訪問の約${Math.round((cnt / h.total) * 100)}%を担当）`;
          }
        }
        return { score, historyNote };
      };

      const targets = visits
        .filter(v => v.date === date && isVisitUnassigned(v, nurseIdSet) && !v.isExcludedFromAutoAssign)
        .map(v => {
          const hasPref = (v.preferredNurseNames || []).some(Boolean);
          const constrained = v.requiresFemaleNurse || (v.excludedNurseNames || []).length > 0;
          return { v, rank: hasPref ? 0 : constrained ? 1 : 2 };
        })
        // 条件の厳しい予定（優先担当あり → 女性限定・除外あり → その他）から先に席を確保する
        .sort((a, b) => a.rank - b.rank || parseTime(a.v.startTime) - parseTime(b.v.startTime) || (b.v.duration || 0) - (a.v.duration || 0));

      const assignedTo = new Map();
      const reasons = {};        // 予定ID → なぜその人になったか／なぜ未割り当てか
      const failed = [];
      let historyHits = 0, overtimeCount = 0, noLunchCount = 0;

      targets.forEach(({ v }) => {
        let best = null, bestFit = null, why = '';

        // 1) 優先担当者の指定があれば、時間外でない限りその人へ
        for (const prefName of (v.preferredNurseNames || [])) {
          if (!prefName) continue;
          const s = states.find(st => !st.isOff && nurseNameMatches(st.nurse.name, prefName));
          if (!s) continue;
          const fit = classifyFit(s, v, opts);
          // 優先担当者は利用者側の希望なので、女性限定の条件より優先する（従来どおり）
          const fitIgnoringFemale = (!fit.ok && fit.code === 'female') ? classifyFit(s, { ...v, requiresFemaleNurse: false }, opts) : fit;
          if (fitIgnoringFemale.ok && fitIgnoringFemale.level < 5) { best = s; bestFit = fitIgnoringFemale; why = `優先担当者に指定されているため（${prefName}）`; break; }
        }

        // 2) それ以外は、無理のない段階から順に、点数の良い人を選ぶ
        if (!best) {
          const fits = states.map(s => ({ s, fit: classifyFit(s, v, opts) })).filter(x => x.fit.ok);
          outer:
          for (const level of [1, 2, 3, 4, 5]) {
            for (const low of [false, true]) {
              let bestScore = Infinity, note = null;
              fits.forEach(({ s, fit }) => {
                if (fit.level !== level || !!s.nurse.isLowPriority !== low) return;
                const { score, historyNote } = scoreOf(s, v, fit);
                if (score < bestScore) { bestScore = score; best = s; bestFit = fit; note = historyNote; }
              });
              if (best) {
                const sameLevel = fits.filter(x => x.fit.level === level && !!x.s.nurse.isLowPriority === low).length;
                if (note) { why = note; historyHits++; }
                else if (sameLevel === 1) why = 'この時間に入れる担当者が1名だけだったため';
                else why = `入れる${sameLevel}名のうち、負担と移動が最も少ないため`;
                break outer;
              }
            }
          }
        }

        if (!best) {
          failed.push(v);
          const rows = states.map(s => { const fit = classifyFit(s, v, opts); return { ok: fit.ok, code: fit.code }; });
          reasons[v.id] = `入れる担当者がいません：${summarizeRejections(rows) || '出勤者なし'}`;
          return;
        }
        const start = parseTime(v.startTime), dur = v.duration || 30;
        best.items.push({ start, end: start + dur, visit: v });
        best.items.sort((a, b) => a.start - b.start);
        best.total += dur;
        if (start < 12 * 60) best.am += dur; else best.pm += dur;
        assignedTo.set(v.id, best.nurse.id);
        if (bestFit.level === 5) overtimeCount++;
        if (bestFit.level === 2 || bestFit.level === 4) noLunchCount++;
        reasons[v.id] = why + (FIT_LABELS[bestFit.level] ? `。※ ${FIT_LABELS[bestFit.level]}` : '');
      });

      return {
        visits: visits.map(v => assignedTo.has(v.id) ? { ...v, nurseId: assignedTo.get(v.id) } : v),
        assignedCount: assignedTo.size,
        failed,
        reasons,
        historyHits,
        overtimeCount,
        noLunchCount
      };
    };

    // 利用者スプレッドシートの内容（sheetRows）を、今ある予定（visits）に突き合わせる。
    // 表示中の1週間（weekDates）だけを対象にし、担当者の割り当て・固定・コメントはできるだけ引き継ぐ。
    const mergeSheetVisits = ({ visits, sheetRows, weekDates }) => {
      const keyOf = (v) => `${normalizeName(v.userName)}|${v.date}|${v.originalStartTime || v.startTime}`;
      const dayKeyOf = (v) => `${normalizeName(v.userName)}|${v.date}`;
      const isSheetManaged = (v) => v.type !== 'other' && !v.isAccompany;
      const inWeek = (v) => weekDates.includes(v.date);

      const sheetByKey = new Map();
      sheetRows.forEach(r => { if (!sheetByKey.has(keyOf(r))) sheetByKey.set(keyOf(r), r); });
      const existingKeys = new Set(visits.filter(isSheetManaged).map(keyOf));

      const carryOver = (sheetRow, v, startTime) => ({
        ...sheetRow,
        id: v.id,
        nurseId: v.nurseId ?? null,
        startTime,
        customTravelTime: v.customTravelTime ?? null,
        isExcludedFromAutoAssign: !!v.isExcludedFromAutoAssign,
        ...(v.comment ? { comment: v.comment } : {})
      });

      const next = [];
      const leftovers = [];   // シートに同じ行が見つからなかった既存の予定
      let updated = 0;
      visits.forEach(v => {
        if (!isSheetManaged(v) || !inWeek(v)) { next.push(v); return; }
        const row = sheetByKey.get(keyOf(v));
        if (row) { next.push(carryOver(row, v, v.startTime)); updated++; }
        else leftovers.push(v);
      });

      // シートにしか無い行（＝新規）。ただし「時間だけ変わった」既存の予定があれば、担当者を引き継ぐ
      const newRows = sheetRows.filter(r => !existingKeys.has(keyOf(r)));
      const newByDay = new Map();
      newRows.forEach(r => { const k = dayKeyOf(r); if (!newByDay.has(k)) newByDay.set(k, []); newByDay.get(k).push(r); });
      newByDay.forEach(list => list.sort((a, b) => parseTime(a.startTime) - parseTime(b.startTime)));

      let retimed = 0, deleted = 0, deletedAssigned = 0;
      const usedRows = new Set();
      leftovers.sort((a, b) => parseTime(a.originalStartTime || a.startTime) - parseTime(b.originalStartTime || b.startTime));
      leftovers.forEach(v => {
        const list = newByDay.get(dayKeyOf(v)) || [];
        const row = list.find(r => !usedRows.has(r));
        if (row) {
          usedRows.add(row);
          next.push(carryOver(row, v, row.startTime));
          retimed++;
        } else {
          deleted++;
          if (v.nurseId != null) deletedAssigned++;
        }
      });

      let added = 0;
      newRows.forEach(r => { if (!usedRows.has(r)) { next.push(r); added++; } });

      return { visits: next, added, updated, retimed, deleted, deletedAssigned };
    };

    // 看護師スプレッドシートの内容を、今の名簿に突き合わせる。
    // 同じ名前の看護師は「同じID」のまま更新する（IDが変わると、過去・未来の割り当てがすべて外れてしまうため）。
    const mergeNurseSheet = ({ nurses, sheetNurses, makeId }) => {
      const prevByName = new Map();
      nurses.forEach(n => { const k = normalizeName(n.name); if (k && !prevByName.has(k)) prevByName.set(k, n); });
      const usedIds = new Set();
      const usedColors = new Set();
      let kept = 0, added = 0;
      const merged = sheetNurses.map(sn => {
        const prev = prevByName.get(normalizeName(sn.name));
        if (prev && !usedIds.has(prev.id)) {
          usedIds.add(prev.id);
          kept++;
          if (prev.color) usedColors.add(prev.color);
          return { ...sn, id: prev.id, color: prev.color || sn.color };
        }
        return { ...sn, id: null };
      });
      merged.forEach(n => {
        if (n.id != null) return;
        let id = makeId();
        while (usedIds.has(id)) id++;
        usedIds.add(id);
        n.id = id;
        const freeColor = colors.find(c => !usedColors.has(c));
        if (freeColor) n.color = freeColor;
        usedColors.add(n.color);
        added++;
      });
      const removed = nurses.filter(n => !usedIds.has(n.id)).length;
      return { nurses: merged, kept, added, removed };
    };
    /*__PURE_HELPERS_END__*/

    const useDragScroll = () => {
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;

        let isDown = false;
        let startX;
        let scrollLeft;

        const onMouseDown = (e) => {
          isDown = true;
          startX = e.pageX - el.offsetLeft;
          scrollLeft = el.scrollLeft;
        };
        const onMouseLeave = () => {
          isDown = false;
        };
        const onMouseUp = () => {
          isDown = false;
        };
        const onMouseMove = (e) => {
          if (!isDown) return;
          e.preventDefault();
          const x = e.pageX - el.offsetLeft;
          const walk = (x - startX) * 2; 
          el.scrollLeft = scrollLeft - walk;
        };
        const onWheel = (e) => {
          if (e.deltaY !== 0 && !e.shiftKey) {
             const isAtLeft = el.scrollLeft <= 0 && e.deltaY < 0;
             const isAtRight = Math.ceil(el.scrollLeft + el.clientWidth) >= el.scrollWidth && e.deltaY > 0;
             if (!isAtLeft && !isAtRight) {
               e.preventDefault();
               el.scrollLeft += e.deltaY;
             }
          }
        };

        el.addEventListener('mousedown', onMouseDown);
        el.addEventListener('mouseleave', onMouseLeave);
        el.addEventListener('mouseup', onMouseUp);
        el.addEventListener('mousemove', onMouseMove);
        el.addEventListener('wheel', onWheel, { passive: false });

        return () => {
          el.removeEventListener('mousedown', onMouseDown);
          el.removeEventListener('mouseleave', onMouseLeave);
          el.removeEventListener('mouseup', onMouseUp);
          el.removeEventListener('mousemove', onMouseMove);
          el.removeEventListener('wheel', onWheel);
        };
      }, []);

      return ref;
    };

    function App() {
      // URLに ?mode=admin が付いているか（＝管理者としてログインしたい、という意思表示。これだけでは管理者にならない）
      const wantsAdmin = useMemo(() => {
        if (typeof window === 'undefined') return false;
        const params = new URLSearchParams(window.location.search);
        return params.get('mode') === 'admin';
      }, []);

      const scrollRefHeader1 = useDragScroll();
      const scrollRefHeader2 = useDragScroll();
      const scrollRefOverview = useDragScroll();
      const scrollRefSchedule = useDragScroll();

      const [user, setUser] = useState(null);
      const [isSyncing, setIsSyncing] = useState(false);
      // 通信できる状態か
      const [isOnline, setIsOnline] = useState(() => typeof navigator === 'undefined' ? true : navigator.onLine !== false);
      useEffect(() => {

        d.setDate(d.getDate() + 7);
        handleSetStartDate(d.toISOString().split('T')[0]);
        
        const s = new Date(selectedDate);
        s.setDate(s.getDate() + 7);
        setSelectedDate(s.toISOString().split('T')[0]);
      };

      const handlePrevDay = () => {
        if (!selectedDate) return;
        const d = new Date(selectedDate);
        d.setDate(d.getDate() - 1);
        const newDate = d.toISOString().split('T')[0];
        
        if (displayDates.length > 0 && newDate < displayDates[0]) {
           const start = new Date(startDate);
           start.setDate(start.getDate() - 7);
           handleSetStartDate(start.toISOString().split('T')[0]);
        }
        setSelectedDate(newDate);
      };

      const handleNextDay = () => {
        if (!selectedDate) return;
        const d = new Date(selectedDate);
        d.setDate(d.getDate() + 1);
        const newDate = d.toISOString().split('T')[0];
        
        if (displayDates.length > 0 && newDate > displayDates[6]) {
           const start = new Date(startDate);
           start.setDate(start.getDate() + 7);
           handleSetStartDate(start.toISOString().split('T')[0]);
        }
        setSelectedDate(newDate);
      };

      useEffect(() => {
        if (displayDates.length > 0 && !displayDates.includes(selectedDate)) {
          setSelectedDate(displayDates[0]);
        }
      }, [displayDates, selectedDate]);

      const handleDateChange = (dateStr) => {
        setSelectedDate(dateStr);
      };

      const getIsNurseOffType = (nurse, dateStr, statuses) => {
        if (!nurse) return 'work';
        const override = statuses.find(s => s.date === dateStr && s.nurseId === nurse.id);
        if (override && override.status) {
            if (override.status === 'off') return 'full';
            if (override.status === 'am_off') return 'AM';
            if (override.status === 'pm_off') return 'PM';
            if (override.status === 'work') return 'work';
        }
        
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return 'work';
        const jsDayOfWeek = d.getDay();
        
        if (nurse.specificOffDays) {
            const spec = nurse.specificOffDays.find(s => typeof s === 'string' ? s === dateStr : s.date === dateStr);
            if (spec) return typeof spec === 'string' ? 'full' : spec.type;
        }
        
        if (nurse.offDays) {
            const off = nurse.offDays.find(o => typeof o === 'number' ? o === jsDayOfWeek : o.day === jsDayOfWeek);
            if (off) return typeof off === 'number' ? 'full' : off.type;
        }
        
        return 'work';
      };

      const selectedNurse = useMemo(() => nurses.find(n => n.id === selectedNurseId) || nurses[0], [nurses, selectedNurseId]);
      const selectedNurseOffType = selectedNurse ? getIsNurseOffType(selectedNurse, selectedDate, nurseStatuses) : 'work';

      const nurseIdSet = useMemo(() => new Set(nurses.map(n => n.id)), [nurses]);

      const unassignedCount = visits.filter(v => v.date === selectedDate && isVisitUnassigned(v, nurseIdSet)).length;
      
      const hasAssignedVisits = useMemo(() => {
        return visits.some(v => v.date === selectedDate && !isVisitUnassigned(v, nurseIdSet));
      }, [visits, selectedDate, nurseIdSet]);

      const latestSyncedDate = useMemo(() => {
        if (!visits || visits.length === 0) return null;
        const dates = visits.map(v => v.date).filter(Boolean);
        if (dates.length === 0) return null;
        return dates.reduce((a, b) => a > b ? a : b);
      }, [visits]);

      const allSchedules = useMemo(() => {
        const schedules = {};
        nurses.forEach(nurse => {
          const offType = getIsNurseOffType(nurse, selectedDate, nurseStatuses);
          if (offType === 'full') { schedules[nurse.id] = { isOff: true, offType: 'full', visits: [], calculatedStartTime: nurse.startTime }; return; }
          
          const assigned = visits.filter(v => v.nurseId === nurse.id && v.date === selectedDate);
          const sorted = [...assigned].sort((a, b) => parseTime(a.startTime) - parseTime(b.startTime));
          
          const { startMin: workStartTimeMin, endMin: workEndTimeMin } = workWindow(nurse, offType, settings);

          let currentTime = workStartTimeMin;
          let calculatedStartTime = currentTime;
          let calcVisits = [];
          const homePoint = pointOf({ location: nurse.startLocation, address: nurse.address });
          let currentLoc = homePoint;
          
          sorted.forEach((visit, idx) => {
            const visitPoint = pointOf(visit);
            const travelTime = visit.customTravelTime ?? travelMinutes(currentLoc, visitPoint, baseTravelTime, travelSpeedKmh);
            
            if (idx === 0) {
              const targetStart = parseTime(visit.startTime);
              if (targetStart - travelTime > currentTime) {
                currentTime = targetStart - travelTime;
                calculatedStartTime = currentTime;
              }
            }

            const arrivalTime = currentTime + travelTime;
            const actualStart = Math.max(arrivalTime, parseTime(visit.startTime));
            
            calcVisits.push({ 
              ...visit, 
              travelTime, 
              isLate: arrivalTime > parseTime(visit.startTime), 
              waitTime: actualStart - arrivalTime, 
              arrivalTime: formatTime(arrivalTime), 
              actualStartTime: formatTime(actualStart), 
              departureTime: formatTime(actualStart + visit.duration) 
            });
            currentTime = actualStart + visit.duration; 
            currentLoc = visitPoint;
          });
          
          let finalTravelTime = 0, returnTime = null;
          if (calcVisits.length > 0) {
            finalTravelTime = travelMinutes(currentLoc, homePoint, baseTravelTime, travelSpeedKmh);
            returnTime = formatTime(currentTime + finalTravelTime);
          } else {
            returnTime = formatTime(workStartTimeMin);
          }
          schedules[nurse.id] = { 
            isOff: false, 
            offType, 
            visits: calcVisits, 
            returnTime, 
            finalTravelTime, 
            calculatedStartTime: formatTime(calculatedStartTime),
            workStartTimeStr: formatTime(workStartTimeMin),
            workEndTimeMin: workEndTimeMin,
            // 昼休憩を取れる空きがあるか（設定が有効で、終日勤務のときだけ判定）
            noLunch: settings.lunch.enabled && offType === 'work' && sorted.length > 0
              && !hasLunchGap(sorted.map(v => ({ start: parseTime(v.startTime), end: parseTime(v.startTime) + (v.duration || 30) })), workStartTimeMin, workEndTimeMin, settings.lunch)
          };
        });
        return schedules;
      }, [nurses, visits, selectedDate, baseTravelTime, nurseStatuses, pointOf, travelSpeedKmh, settings]);

      const firstVisitMinutes = useMemo(() => {
        const starts = visits.filter(v => v.date === selectedDate).map(v => parseTime(v.startTime));
        return starts.length > 0 ? Math.min(...starts) : null;
      }, [visits, selectedDate]);
      const hasDayVisits = firstVisitMinutes !== null;

      // 担当者ごとの負担（その日の内訳と、表示中の週の合計）
      const workloadRows = useMemo(() => {
        if (!showWorkload || activeTab !== 'overview') return null;
        const weekSet = new Set(displayDates);
        const week = {};
        visits.forEach(v => {
          if (v.type === 'other' || !weekSet.has(v.date) || isVisitUnassigned(v, nurseIdSet)) return;
          const w = week[v.nurseId] || (week[v.nurseId] = { count: 0, min: 0 });
          w.count++; w.min += v.duration || 0;
        });
        const rows = nurses.map(n => ({ nurse: n, load: computeWorkload(allSchedules[n.id]), week: week[n.id] || { count: 0, min: 0 } }));
        const working = rows.filter(r => r.load && r.load.spanMin > 0);
        const avgRatio = working.length > 0 ? working.reduce((sum, r) => sum + r.load.ratio, 0) / working.length : 0;
        const maxScale = Math.max(1, ...working.map(r => Math.max(r.load.spanMin, r.load.totalMin)));
        return { rows, avgRatio, maxScale, workingCount: working.length };
      }, [showWorkload, activeTab, nurses, allSchedules, visits, displayDates, nurseIdSet]);

      useEffect(() => {
        if (activeTab !== 'overview') return;
        const el = timelineScrollRef.current;
        if (!el || typeof window === 'undefined' || window.innerWidth >= 768) return;
        let target = firstVisitMinutes ?? 8 * 60 + 30;
        if (selectedDate === getTodayStr()) target = Math.max(target, getNowMinutes() - 60);
        target = Math.min(target, (END_HOUR - 2) * 60);
        el.scrollTop = Math.max(0, getTop(target - 20));
      }, [activeTab, selectedDate, hasDayVisits]);

      const stats = useMemo(() => {
        const sch = selectedNurse ? allSchedules[selectedNurse.id]?.visits || [] : [];
        let tt = 0, tv = 0, lc = 0;
        sch.forEach(s => { tt += s.travelTime; tv += s.duration; if (s.isLate) lc++; });
        if (sch.length > 0 && selectedNurse && selectedNurseOffType !== 'full') { tt += allSchedules[selectedNurse.id]?.finalTravelTime || 0; }
        return { totalTravel: tt, totalVisit: tv, count: sch.length, lateCount: lc };
      }, [allSchedules, selectedNurse, selectedNurseOffType]);

      const unassignedVisitsWithLayout = useMemo(() => {
        const filtered = visits.filter(v => v.date === selectedDate && isVisitUnassigned(v, nurseIdSet)).sort((a, b) => parseTime(a.startTime) - parseTime(b.startTime));
        
        const groups = [];
        let currentGroup = [];
        let groupEnd = 0;
        
        filtered.forEach(visit => {
          const start = parseTime(visit.startTime);
          const end = start + Math.max(visit.duration, 24); 
          
          if (currentGroup.length === 0) {
            currentGroup.push(visit);
            groupEnd = end;
          } else {
            if (start < groupEnd) {
              currentGroup.push(visit);
              groupEnd = Math.max(groupEnd, end);
            } else {
              groups.push(currentGroup);
              currentGroup = [visit];
              groupEnd = end;
            }
          }
        });
        if (currentGroup.length > 0) groups.push(currentGroup);
        
        const layouted = [];
        groups.forEach(group => {
          const cols = [];
          group.forEach(visit => {
            const start = parseTime(visit.startTime);
            let placed = false;
            for(let i = 0; i < cols.length; i++){
               const lastInCol = cols[i][cols[i].length - 1];
               const lastEnd = parseTime(lastInCol.startTime) + Math.max(lastInCol.duration, 24);
               if (lastEnd <= start) {
                 cols[i].push(visit);
                 visit._col = i;
                 placed = true;
                 break;
               }
            }
            if(!placed){
              visit._col = cols.length;
              cols.push([visit]);
            }
          });
          
          group.forEach(visit => {
            layouted.push(visit);
          });
        });
        
        return layouted;
      }, [visits, selectedDate, nurseIdSet]);

      const handlePrevReportMonth = () => {
        const [y, m] = reportMonth.split('-').map(Number);
        const d = new Date(y, m - 2, 1);
        setReportMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
      };

      const handleNextReportMonth = () => {
        const [y, m] = reportMonth.split('-').map(Number);
        const d = new Date(y, m, 1);
        setReportMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
      };

      const reportData = useMemo(() => {
        const [year, month] = reportMonth.split('-').map(Number);
        const daysInMonth = new Date(year, month, 0).getDate();
        
        const dailyStats = [];
        let monthlyTotal = 0;
        let monthlyTotalDuration = 0;
        const monthlyNurseTotals = {};
        const monthlyNurseDurations = {};
        nurses.forEach(n => {
           monthlyNurseTotals[n.id] = 0;
           monthlyNurseDurations[n.id] = 0;
        });
        let monthlyUnassigned = 0;
        let monthlyUnassignedDuration = 0;

        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const dayVisits = visits.filter(v => v.date === dateStr);
          
          const realVisits = dayVisits.filter(v => v.type !== 'other');
          
          const dailyTotal = realVisits.length;
          let dailyTotalDuration = 0;
          monthlyTotal += dailyTotal;

          const nurseCounts = {};
          const nurseDurations = {};
          nurses.forEach(n => {
              nurseCounts[n.id] = 0;
              nurseDurations[n.id] = 0;
          });
          let unassigned = 0;
          let unassignedDuration = 0;

          realVisits.forEach(v => {
            const dur = v.duration || 0;
            dailyTotalDuration += dur;
            monthlyTotalDuration += dur;

            if (!isVisitUnassigned(v, nurseIdSet)) {
              nurseCounts[v.nurseId] = (nurseCounts[v.nurseId] || 0) + 1;
              monthlyNurseTotals[v.nurseId] = (monthlyNurseTotals[v.nurseId] || 0) + 1;
              
              nurseDurations[v.nurseId] += dur;
              monthlyNurseDurations[v.nurseId] += dur;
            } else {
              unassigned++;
              monthlyUnassigned++;
              unassignedDuration += dur;
              monthlyUnassignedDuration += dur;
            }
          });

          const jsDay = new Date(year, month - 1, d).getDay();

          dailyStats.push({
            dateStr,
            day: d,
            jsDay,
            total: dailyTotal,
            totalDuration: dailyTotalDuration,
            unassigned,
            unassignedDuration,
            nurseCounts,
            nurseDurations
          });
        }

        return {
          dailyStats,
          monthlyTotal,
          monthlyTotalDuration,
          monthlyNurseTotals,
          monthlyNurseDurations,
          monthlyUnassigned,
          monthlyUnassignedDuration
        };
      }, [reportMonth, visits, nurses, nurseIdSet]);

      // 保存データ量（集計レポートを開いたときだけ計算する）
      const storageInfo = useMemo(() => {
        if (activeTab !== 'report') return null;
        const LIMIT = 1048576; // Firestoreの1ドキュメント上限（約1MB）
        const bytes = estimateDocSize();
        const dates = liveVisits.map(v => v.date).filter(Boolean).sort();
        const oldest = dates[0] || null;
        const newest = dates[dates.length - 1] || null;
        let monthsLeft = null;
        if (oldest && newest) {
          const spanDays = (new Date(newest) - new Date(oldest)) / 86400000 + 1;
          if (spanDays >= 28 && bytes > 0) monthsLeft = Math.max(0, Math.floor(((LIMIT - bytes) / (bytes / spanDays)) / 30));
        }
        const unknownNurse = liveVisits.filter(v => v.nurseId != null && !nurseIdSet.has(v.nurseId)).length;
        // 保管庫へ移せる対象（今月を含めて ARCHIVE_KEEP_MONTHS か月より前）
        const now = new Date();
        const cutoffDate = new Date(now.getFullYear(), now.getMonth() - (ARCHIVE_KEEP_MONTHS - 1), 1);
        const cutoffMonth = `${cutoffDate.getFullYear()}-${String(cutoffDate.getMonth() + 1).padStart(2, '0')}`;
        const archivable = liveVisits.filter(v => v.date && monthOf(v.date) < cutoffMonth).length;
        return { bytes, limit: LIMIT, percent: Math.min(100, Math.round((bytes / LIMIT) * 100)), oldest, newest, count: liveVisits.length, monthsLeft, unknownNurse, cutoffMonth, archivable };
      }, [activeTab, liveVisits, nurses, nurseStatuses, savedPatterns, dailyMemos, nurseIdSet, archivedMonths, geoCache]);

      const downloadJson = (payload, filename) => {
        const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };

      // 保管庫の全データを読み込む（バックアップ用）
      const loadAllArchives = async () => {
        const archives = {};
        for (const month of archivedMonths) {
          const snap = await getDoc(archiveDocRef(month));
          const d = snap.exists() ? snap.data() : {};
          archives[month] = { visits: decodeField(d.visits, []), savedPatterns: decodeField(d.savedPatterns, {}) };
        }
        return archives;
      };

      // 全データ（保管庫も含む）をJSONファイルとして端末に保存する
      const handleDownloadBackup = async (silent = false) => {
        if (!isAdminUser) return false;
        try {
          const archives = await loadAllArchives();
          const payload = { app: 'CareRoute', version: 2, exportedAt: new Date().toISOString(), nurses, visits: liveVisits, nurseStatuses, savedPatterns, dailyMemos, baseTravelTime, travelSpeedKmh, sheetUrl, nurseSheetUrl, geoCache, archivedMonths, archives };
          const stamp = new Date().toTimeString().slice(0, 8).replace(/:/g, '');
          downloadJson(payload, `careroute-backup-${getTodayStr()}-${stamp}.json`);
          if (!silent) { setToastMessage("バックアップを保存しました（利用者の個人情報を含むため、取り扱いにご注意ください）"); setShowToast(true); }
          return true;
        } catch (e) {
          console.error(e);
          setToastMessage("バックアップの保存に失敗しました");
          setShowToast(true);
          return false;
        }
      };

      // バックアップファイルを選んだとき：中身を確かめて、確認画面を出す（この時点ではまだ何も書き換えない）
      const handleRestoreFileChosen = (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file || !isAdminUser) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(String(reader.result));
            if (data?.app !== 'CareRoute' || !Array.isArray(data.visits) || !Array.isArray(data.nurses)) throw new Error("形式が違います");
            const archives = (data.archives && typeof data.archives === 'object') ? data.archives : {};
            const archivedCount = Object.values(archives).reduce((sum, a) => sum + (Array.isArray(a?.visits) ? a.visits.length : 0), 0);
            setRestoreCandidate({ data, fileName: file.name, archivedCount });
          } catch (err) {
            console.error(err);
            setToastMessage("このファイルはCareRouteのバックアップとして読み込めませんでした。何も変更していません。");
            setShowToast(true);
          }
        };
        reader.readAsText(file);
      };

      // 復元の実行：①いまの状態を自動でバックアップ → ②保管庫 → ③メインの順に書き込む
      const executeRestore = async () => {
        if (!isAdminUser || !isOnline || !restoreCandidate || !db) return;
        const { data } = restoreCandidate;
        setArchiveBusy(true);
        try {
          const saved = await handleDownloadBackup(true);
          if (!saved) throw new Error("復元前のバックアップに失敗したため中止しました");
          const archives = (data.archives && typeof data.archives === 'object') ? data.archives : {};
          const months = Object.keys(archives).filter(m => /^\d{4}-\d{2}$/.test(m)).sort();
          for (const month of months) {
            await setDoc(archiveDocRef(month), { month, visits: encodeField(archives[month].visits || []), savedPatterns: encodeField(archives[month].savedPatterns || {}), updatedAt: new Date().toISOString() });
          }
          await setDoc(mainDocRef(), {
            nurses: JSON.stringify(data.nurses),
            visits: encodeField(data.visits),
            nurseStatuses: encodeField(data.nurseStatuses || []),
            savedPatterns: encodeField(data.savedPatterns || {}),
            dailyMemos: JSON.stringify(data.dailyMemos || {}),
            baseTravelTime: data.baseTravelTime ?? 7,
            travelSpeedKmh: data.travelSpeedKmh ?? DEFAULT_TRAVEL_SPEED_KMH,
            sheetUrl: data.sheetUrl || sheetUrl || "",
            nurseSheetUrl: data.nurseSheetUrl || nurseSheetUrl || "",
            geoCache: JSON.stringify(data.geoCache || {}),
            archivedMonths: JSON.stringify(months)
          }, { merge: true });
          setArchiveCache({});
          setHistory([]);
          setRestoreCandidate(null);
          setToastMessage("バックアップから復元しました（復元前の状態も、いま端末に保存したファイルから戻せます）");
        } catch (e) {
          console.error(e);
          setToastMessage(`復元に失敗しました：${e?.message || e?.code || "不明なエラー"}`);
        } finally {
          setArchiveBusy(false);
          setShowToast(true);
        }
      };

      // 古い月のデータを「保管庫」（月ごとの別の保存場所）へ移す。
      // 安全のため「先に保管庫へ書く → 成功を確認 → メイン側から外す」の順で行う。
      const handleArchiveOldData = async () => {
        if (!isAdminUser || !isOnline || !db || !storageInfo || storageInfo.archivable === 0) return;
        const cutoff = storageInfo.cutoffMonth;
        setArchiveBusy(true);
        try {
          const byMonth = {};
          liveVisits.forEach(v => {
            const m = monthOf(v.date);
            if (v.date && m < cutoff) (byMonth[m] = byMonth[m] || { visits: [], savedPatterns: {} }).visits.push(v);
          });
          Object.keys(savedPatterns).forEach(date => {
            const m = monthOf(date);
            if (m < cutoff) (byMonth[m] = byMonth[m] || { visits: [], savedPatterns: {} }).savedPatterns[date] = savedPatterns[date];
          });
          const months = Object.keys(byMonth).sort();
          for (const month of months) {
            let mergedVisits = byMonth[month].visits;
            let mergedPatterns = byMonth[month].savedPatterns;
            if (archivedMonthSet.has(month)) {
              // すでに保管済みの月に追加する場合は、中身を合体させる
              const snap = await getDoc(archiveDocRef(month));
              const d = snap.exists() ? snap.data() : {};
              const ids = new Set(mergedVisits.map(v => v.id));
              mergedVisits = [...decodeField(d.visits, []).filter(v => !ids.has(v.id)), ...mergedVisits];
              mergedPatterns = { ...decodeField(d.savedPatterns, {}), ...mergedPatterns };
            }
            await setDoc(archiveDocRef(month), { month, visits: encodeField(mergedVisits), savedPatterns: encodeField(mergedPatterns), updatedAt: new Date().toISOString() });
          }
          const nextVisits = liveVisits.filter(v => !(v.date && monthOf(v.date) < cutoff));
          const nextPatterns = {};
          Object.keys(savedPatterns).forEach(date => { if (monthOf(date) >= cutoff) nextPatterns[date] = savedPatterns[date]; });
          const nextMonths = [...new Set([...archivedMonths, ...months])].sort();
          await setDoc(mainDocRef(), { visits: encodeField(nextVisits), savedPatterns: encodeField(nextPatterns), archivedMonths: JSON.stringify(nextMonths) }, { merge: true });
          setArchiveCache({});
          setHistory([]);
          setToastMessage(`${months.length}か月分（${liveVisits.length - nextVisits.length}件）を保管庫へ移しました。保管した月も、その日付を開けばこれまでどおり閲覧できます。`);
        } catch (e) {
          console.error(e);
          setToastMessage(`保管に失敗しました：${e?.message || e?.code || "不明なエラー"}（データは失われていません）`);
        } finally {
          setArchiveBusy(false);
          setShowToast(true);
        }
      };

      // 保管済みの月を、編集できる場所へ戻す
      const handleUnarchiveMonth = async (month) => {
        if (!isAdminUser || !isOnline || !db || !archivedMonthSet.has(month)) return;
        setArchiveBusy(true);
        try {
          const snap = await getDoc(archiveDocRef(month));
          const d = snap.exists() ? snap.data() : {};
          const back = decodeField(d.visits, []);
          const ids = new Set(liveVisits.map(v => v.id));
          const nextVisits = [...liveVisits, ...back.filter(v => !ids.has(v.id))];
          const nextPatterns = { ...decodeField(d.savedPatterns, {}), ...savedPatterns };
          const nextMonths = archivedMonths.filter(m => m !== month);
          await setDoc(mainDocRef(), { visits: encodeField(nextVisits), savedPatterns: encodeField(nextPatterns), archivedMonths: JSON.stringify(nextMonths) }, { merge: true });
          setArchiveCache({});
          setToastMessage(`${month.replace('-', '年')}月のデータを編集できる状態に戻しました`);
        } catch (e) {
          console.error(e);
          const tooBig = e?.code === 'resource-exhausted' || e?.code === 'invalid-argument';
          setToastMessage(tooBig ? "戻せませんでした：データ量が上限を超えます。先にほかの古い月を保管庫へ移してください。" : `戻せませんでした：${e?.message || e?.code || "不明なエラー"}`);
        } finally {
          setArchiveBusy(false);
          setShowToast(true);
        }
      };

        const check = (obj) => {
          const key = normalizeAddress(obj.address);
          if (!key) return;
          if (pointOf(obj).lat != null) known.add(key); else missing.add(key);
        };
        const today = getTodayStr();
        liveVisits.forEach(v => { if (v.type !== 'other' && v.date >= today) check(v); });
        nurses.forEach(n => check({ location: n.startLocation, address: n.address }));
        return { known: known.size, missing: [...missing] };

      const handleGeocode = async () => {
        if (!isAdminUser || !geoStatus || geoStatus.missing.length === 0 || geoProgress) return;
        const targets = geoStatus.missing;
        if (!window.confirm(`住所 ${targets.length}件の位置（緯度・経度）を調べます。\n\n・国土地理院の住所検索サービスに「住所」を送信します（氏名は送信しません）\n・結果は移動時間の計算だけに使います\n\n実行しますか？`)) return;
        const nextCache = { ...geoCache };
        let ok = 0, ng = 0;
        setGeoProgress({ done: 0, total: targets.length });
        try {
          for (let i = 0; i < targets.length; i++) {
            try {
              const res = await fetch(`https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(targets[i])}`);
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              const list = await res.json();
              const c = Array.isArray(list) && list[0]?.geometry?.coordinates;
              const lat = c ? Number(c[1]) : NaN, lng = c ? Number(c[0]) : NaN;
              if (isValidLatLng(lat, lng)) { nextCache[targets[i]] = [Math.round(lat * 1e5) / 1e5, Math.round(lng * 1e5) / 1e5]; ok++; }
              else ng++;
            } catch (err) { console.error("geocode failed:", err); ng++; }
            setGeoProgress({ done: i + 1, total: targets.length });
            await new Promise(r => setTimeout(r, 250)); // 相手のサーバーに負荷をかけないよう間隔をあける
          }
