        if (isNaN(visitId)) return;
        
        const targetVisit = visits.find(v => v.id === visitId);
        
        if (targetVisit && targetVisit.isExcludedFromAutoAssign) {
            return;
        }

        let newStartTimeStr = targetVisit.startTime;
        const targetStartMin = parseTime(targetVisit.startTime);

        const offsetY = parseFloat(e.dataTransfer.getData('offsetY') || 0);
        const rect = e.currentTarget.getBoundingClientRect();
        const y = (e.clientY - rect.top) - offsetY;
        const minutes = y / PIXELS_PER_MINUTE + START_HOUR * 60;
        const snappedMinutes = Math.round(minutes / 15) * 15; 
        newStartTimeStr = formatTime(Math.max(START_HOUR * 60, Math.min(END_HOUR * 60 - 15, snappedMinutes)));
        const newStartMin = parseTime(newStartTimeStr);

        if (targetNurseId) {
            const targetNurse = nurses.find(n => n.id === targetNurseId);
            const problem = assignProblem(targetVisit, targetNurse, getIsNurseOffType(targetNurse, selectedDate, nurseStatuses), newStartMin, settings);
            if (problem) { setToastMessage(problem); setShowToast(true); return; }
        }
        
        saveHistory();
        handleSetVisits(prev => prev.map(v => {
          if (v.id === visitId) {
             const original = v.originalStartTime || v.startTime;
             return { ...v, nurseId: targetNurseId, startTime: newStartTimeStr, originalStartTime: original, date: selectedDate };
          }
          return v;
        }));
      };

      const updateVisitNurse = (visitId, newNurseId) => {
        if (!isAdmin) return;
        const parsedNurseId = newNurseId === 'unassigned' ? null : parseInt(newNurseId);
        const targetVisit = visits.find(v => v.id === visitId);
        const targetStart = parseTime(targetVisit.startTime);
        
        if (parsedNurseId) {
            const targetNurse = nurses.find(n => n.id === parsedNurseId);
            const problem = assignProblem(targetVisit, targetNurse, getIsNurseOffType(targetNurse, selectedDate, nurseStatuses), targetStart, settings);
            if (problem) { setToastMessage(problem); setShowToast(true); return; }
        }

        saveHistory();
        handleSetVisits(prev => prev.map(v => v.id === visitId ? { ...v, nurseId: parsedNurseId } : v));
      };

      // スマホなど、ドラッグができない端末向け：メニューから担当者と開始時刻を変更する
      const handleMoveSubmit = (e) => {
        e.preventDefault();
        if (!isAdmin || !moveTarget) return;
        const formData = new FormData(e.target);
        const nurseValue = formData.get('nurseId');
        const newNurseId = nurseValue === 'unassigned' ? null : parseInt(nurseValue, 10);
        const newStart = String(formData.get('startTime') || moveTarget.startTime);
        const startMin = parseTime(newStart);
        const target = visits.find(v => v.id === moveTarget.id);
        if (!target || target.isExcludedFromAutoAssign) { setMoveTarget(null); return; }
        let overlapNote = "";
        if (newNurseId) {
          const nurse = nurses.find(n => n.id === newNurseId);
          const problem = assignProblem(target, nurse, getIsNurseOffType(nurse, target.date, nurseStatuses), startMin, settings);
          if (problem) { setToastMessage(problem); setShowToast(true); return; }
          const overlap = findOverlap(visits, target, newNurseId, target.date, startMin);
          if (overlap) overlapNote = `（※ ${overlap.userName} ${overlap.startTime}〜 と時間が重なっています）`;
        }
        saveHistory();
        handleSetVisits(prev => prev.map(v => v.id === target.id
          ? { ...v, nurseId: newNurseId, startTime: newStart, originalStartTime: v.originalStartTime || v.startTime }
          : v));
        setMoveTarget(null);
        setToastMessage(`${target.userName} を ${newNurseId ? nurses.find(n => n.id === newNurseId).name : '未割り当て'}・${newStart} に変更しました${overlapNote}`);
        setShowToast(true);
      };

      const updateCustomTravelTime = (visitId, newTime) => {
        if (!isAdmin) return;
        handleSetVisits(prev => prev.map(v => v.id === visitId ? { ...v, customTravelTime: newTime } : v));
      };

      const handleAddEvent = (e) => {
        if (!isAdmin) return;
        e.preventDefault();
        const formData = new FormData(e.target);
        const title = formData.get('title');
        const startTime = formData.get('startTime');
        const duration = parseInt(formData.get('duration'), 10);
        const nurseIdStr = formData.get('nurseId');
        const isLocked = formData.get('isLocked') === 'on';
        
        const baseEvent = {
          userName: title,
          type: 'other',
          date: selectedDate,
          dayOfWeek: new Date(selectedDate).getDay(),
          startTime: startTime,
          originalStartTime: startTime,
          duration: duration,
          requiresFemaleNurse: false,
          preferredNurseNames: [],
          excludedNurseNames: [],
          isExcludedFromAutoAssign: isLocked,
          location: { x: 50, y: 50 } 
        };

        const newEvents = [];
        if (nurseIdStr === 'all') {
          const availableNurses = nurses.filter(n => getIsNurseOffType(n, selectedDate, nurseStatuses) !== 'full');
          availableNurses.forEach((n, idx) => {
            newEvents.push({
              ...baseEvent,
              id: Date.now() + idx,
              nurseId: n.id,
              location: n.startLocation || { x: 50, y: 50 }
            });
          });
        } else {
          const nId = nurseIdStr === 'unassigned' ? null : parseInt(nurseIdStr, 10);
          const targetNurse = nurses.find(n => n.id === nId);
          newEvents.push({
            ...baseEvent,
            id: Date.now(),
            nurseId: nId,
            location: targetNurse?.startLocation || { x: 50, y: 50 }
          });
        }
        
        saveHistory();
        handleSetVisits([...visits, ...newEvents]);
        setShowAddEventModal(false);
        setToastMessage("予定を追加しました");
        setShowToast(true);
      };

      const handleFetchSheet = async () => {
        if (!isAdmin) return;
        if (!sheetUrl) { setToastMessage("「接続設定」に利用者スプレッドシートのURLを入力してください"); setShowToast(true); return; }
        setIsLoadingSheet(true);
        try {
          const res = await fetch(sheetUrl);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const txt = await res.text();
          // 週の基準は必ず「表示中の週の月曜日」にする（開始日が月曜以外でも日付がずれないように）
          const weekMonday = displayDates[0] || getMondayStr(startDate || getTodayStr());
          if (looksLikeHtml(txt)) throw new Error("CSVではなくWebページが返されました（URLまたは公開設定の誤り）");
          const rows = parseCsv(txt);
          const dayMap = { '日': 0, '月': 1, '火': 2, '水': 3, '木': 4, '金': 5, '土': 6 };
          const result = [];
          
          for (let i = 1; i < rows.length; i++) {
            const p = rows[i];
            if (p[9] && p[9].includes('休止')) continue; 
            if (p[0]?.trim()) {
              const nameStr = p[0].trim();
              const dateOrDay = p[1]?.trim() || '';
              let st = p[2]?.trim() || '09:00'; if (st.length === 4) st = '0' + st;
              const dur = parseInt(p[3]) || 30;
              const requiresFemale = p[4] ? p[4].includes('女性') : false;
              
              const prefNurse1 = p[5]?.trim() || null;
              const prefNurse2 = p[6]?.trim() || null;
              const preferredNames = [prefNurse1, prefNurse2].filter(Boolean);
              
              const excludedNursesStr = p[7]?.trim() || '';
              const excludedNurseNames = excludedNursesStr ? excludedNursesStr.split(/[・,、]/).map(n => n.trim()).filter(Boolean) : [];

              const address = p[8]?.trim() || '';
              // 任意の列：緯度(11列目)・経度(12列目)。入っていれば実際の距離で移動時間を計算する
              const lat = parseFloat(p[10]), lng = parseFloat(p[11]);
              const latLng = isValidLatLng(lat, lng) ? { lat, lng } : {};

              let visitDate = '';
              if (dateOrDay.includes('/') || dateOrDay.includes('-')) {
                visitDate = normalizeDateStr(dateOrDay);
              } else {
                const targetDay = dayMap[dateOrDay];
                const start = new Date(weekMonday);
                // 月=0 … 日=6 日分だけ月曜から進める（曜日が読み取れない行は従来どおり月曜に置く）
                if (targetDay !== undefined) start.setDate(start.getDate() + ((targetDay + 6) % 7));
                visitDate = start.toISOString().split('T')[0];
              }

              result.push({ 
                id: Date.now() + i, 
                userName: nameStr.includes('様') ? nameStr : nameStr + ' 様', 
                location: { ...getHashLoc(address || nameStr), ...latLng }, 
                duration: dur, 
                date: visitDate, 
                dayOfWeek: dayMap[dateOrDay] ?? 1, 
                startTime: st, 
                originalStartTime: st, 
                nurseId: null,
                requiresFemaleNurse: requiresFemale,
                preferredNurseNames: preferredNames,
                excludedNurseNames: excludedNurseNames,
                address: address,
                isExcludedFromAutoAssign: false,
                isAccompany: false
              });
            }
          }
          
          // 取得結果が空のときは、通信エラーやURL間違いの可能性が高いので何も変更しない
          if (result.length === 0) {
            setToastMessage("同期を中止しました：スプレッドシートから利用者を1件も読み取れませんでした（URLや公開設定をご確認ください）。予定は変更していません。");
            setShowToast(true);
            return;
          }

          const merged = mergeSheetVisits({ visits, sheetRows: result, weekDates: displayDates });
          
          saveHistory(); // 「元に戻す」で同期前の状態に戻せるようにする
          handleSetVisits(merged.visits); 
          const parts = [`新規 ${merged.added}件`, `更新 ${merged.updated}件`];
          if (merged.retimed > 0) parts.push(`時間変更 ${merged.retimed}件（担当者は引き継ぎ）`);
          parts.push(`削除 ${merged.deleted}件`);
          let msg = `同期完了: ${parts.join(" / ")}`;
          if (merged.deletedAssigned > 0) msg += `。担当者が決まっていた予定が${merged.deletedAssigned}件削除されました（「元に戻す」で復元できます）`;
          setToastMessage(msg); 
          setShowToast(true);
        } catch (e) { console.error(e); setToastMessage(`同期に失敗しました：${e?.message || "通信エラー"}。予定は変更していません。`); setShowToast(true); } 
        finally { setIsLoadingSheet(false); }
      };

      const handleFetchNurseSheet = async () => {
        if (!isAdminUser) return;
        if (!nurseSheetUrl) { setToastMessage("「接続設定」に看護師スプレッドシートのURLを入力してください"); setShowToast(true); return; }
        setIsLoadingNurseSheet(true);
        try {
          const res = await fetch(nurseSheetUrl);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const txt = await res.text();
          if (looksLikeHtml(txt)) throw new Error("CSVではなくWebページが返されました（URLまたは公開設定の誤り）");
          const rows = parseCsv(txt);
          const dayMap = { '日': 0, '月': 1, '火': 2, '水': 3, '木': 4, '金': 5, '土': 6 };
          const result = [];
          
          for (let i = 1; i < rows.length; i++) {
            const p = rows[i];
            if (p[0]?.trim()) {
              const nameStr = p[0].trim();
              let st = p[1]?.trim() || '08:30'; if (st.length === 4) st = '0' + st;
              let et = p[2]?.trim() || '17:30'; if (et.length === 4) et = '0' + et;
              
              let off = []; 
              if (p[3]) {
                  const rawOffs = p[3].split(/[・,、]/).map(d => d.trim()).filter(Boolean);
                  rawOffs.forEach(rawOff => {
                     let type = 'full';
                     let dayStr = rawOff;
                     if (rawOff.includes('(午前)') || rawOff.includes('(AM)')) { type = 'AM'; dayStr = rawOff.replace(/\(午前\)/g, '').replace(/\(AM\)/g, ''); }
                     else if (rawOff.includes('(午後)') || rawOff.includes('(PM)')) { type = 'PM'; dayStr = rawOff.replace(/\(午後\)/g, '').replace(/\(PM\)/g, ''); }
                     
                     if (dayMap[dayStr] !== undefined) {
                         off.push({ day: dayMap[dayStr], type });
                     }
                  });
              }
              
              const isLow = p[4] ? p[4].includes('低') : false;
              const isFemale = p[5] ? p[5].includes('女性') : false;
              
              let specificOffDays = [];
              if (p[6]) {
                 const rawSpecs = p[6].split(/[・,、]/).map(d => d.trim()).filter(Boolean);
                 rawSpecs.forEach(rawSpec => {
                     let type = 'full';
                     let dateStr = rawSpec;
                     if (rawSpec.includes('(午前)') || rawSpec.includes('(AM)')) { type = 'AM'; dateStr = rawSpec.replace(/\(午前\)/g, '').replace(/\(AM\)/g, ''); }
                     else if (rawSpec.includes('(午後)') || rawSpec.includes('(PM)')) { type = 'PM'; dateStr = rawSpec.replace(/\(午後\)/g, '').replace(/\(PM\)/g, ''); }
                     dateStr = normalizeDateStr(dateStr);

                     if (dateStr) {
                         specificOffDays.push({ date: dateStr, type });
                     }
                 });
              }

              const address = p[7]?.trim() || '';
              // 任意の列：緯度(9列目)・経度(10列目)
              const lat = parseFloat(p[8]), lng = parseFloat(p[9]);
              const latLng = isValidLatLng(lat, lng) ? { lat, lng } : {};
              
              result.push({ 
                id: Date.now() + i, 
                name: nameStr, 
                address: address,
                startLocation: { ...getHashLoc(address || nameStr), ...latLng }, 
                color: colors[result.length % colors.length], 
                startTime: st, 
                endTime: et,
                offDays: off, 
                specificOffDays: specificOffDays,
                isLowPriority: isLow,
                isFemale: isFemale
              });
            }
          }
          
          // 取得結果が空のときは、名簿を空で上書きしない
          if (result.length === 0) {
            setToastMessage("更新を中止しました：スプレッドシートから看護師を1名も読み取れませんでした（URLや公開設定をご確認ください）。名簿は変更していません。");
            setShowToast(true);
            return;
          }

          // 同じ名前の看護師はIDを引き継ぐ（＝作成済みのスケジュールがそのまま残る）
          let seq = 0;
          const merged = mergeNurseSheet({ nurses, sheetNurses: result, makeId: () => Date.now() + (++seq) });
          handleSetNurses(merged.nurses); 
          let msg = `看護師名簿を更新しました（${merged.nurses.length}名）`;
          if (merged.added > 0) msg += ` / 追加 ${merged.added}名`;
          if (merged.removed > 0) msg += ` / 名簿から外れた ${merged.removed}名の予定は「未割り当て」に戻ります`;
          setToastMessage(msg); 
          setShowToast(true);
        } catch (e) { console.error(e); setToastMessage(`名簿の更新に失敗しました：${e?.message || "通信エラー"}。名簿は変更していません。`); setShowToast(true); } 
        finally { setIsLoadingNurseSheet(false); }
      };

      const requestVisitSort = (key) => {
        setVisitSortConfig(prev => ({ key, direction: prev.key === key && prev.direction === 'asc' ? 'desc' : 'asc' }));
      };

      const sortedVisits = useMemo(() => {
        let filtered = visits.filter(v => v.date === selectedDate);
        if (visitSortConfig.key) {
          filtered.sort((a, b) => {
            let valA, valB;
            if (visitSortConfig.key === 'startTime') { 
              valA = parseTime(a.startTime); 
              valB = parseTime(b.startTime); 
            }
            else if (visitSortConfig.key === 'nurseName') {
              const nA = nurses.find(n => n.id === a.nurseId); 
              const nB = nurses.find(n => n.id === b.nurseId);
              valA = nA ? nA.name : '未指定'; 
              valB = nB ? nB.name : '未指定';
              
              if (valA === valB) {
                return parseTime(a.startTime) - parseTime(b.startTime);
              }
            } else { 
              valA = a[visitSortConfig.key]; 
              valB = b[visitSortConfig.key]; 
            }
            if (valA < valB) return visitSortConfig.direction === 'asc' ? -1 : 1;
            if (valA > valB) return visitSortConfig.direction === 'asc' ? 1 : -1;
            return 0;
          });
        }
        return filtered;
      }, [visits, selectedDate, visitSortConfig, nurses]);

      // --- その日その日のメモ機能 ---
      const renderDailyMemo = () => {
        const currentMemo = dailyMemos[selectedDate] || "";
        const isEditing = editingMemoDate === selectedDate;

        if (isEditing) {
            return (
                <div className="bg-amber-50 border-2 border-amber-300 p-3 md:p-4 rounded-2xl shadow-sm mb-2 shrink-0">
                    <div className="flex items-center gap-2 mb-2 text-amber-700 font-black text-xs">
                        <MessageSquare size={14} /> 本日の共有事項・メモ
                    </div>
                    <textarea 
                        className="w-full bg-white border border-amber-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-amber-400 resize-none font-bold text-slate-700" 
                        rows="3" 
                        value={memoInputValue}
                        onChange={(e) => setMemoInputValue(e.target.value)}
                        placeholder="本日の共有事項や連絡事項を入力してください..."
                        autoFocus
                    />
                    <div className="flex justify-end gap-2 mt-3">
                        <button onClick={() => setEditingMemoDate(null)} className="px-4 py-2 text-xs font-black text-slate-500 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 transition-colors">キャンセル</button>
                        <button onClick={() => {
                            handleSetDailyMemo(selectedDate, memoInputValue);
                            setEditingMemoDate(null);
                        }} className="px-4 py-2 text-xs font-black text-white bg-amber-500 rounded-xl hover:bg-amber-600 shadow-md transition-colors">保存する</button>
                    </div>
                </div>
            );
        }

        if (currentMemo) {
            return (
                <div 
                    className={`bg-amber-50 border border-amber-200 p-3 md:p-4 rounded-2xl shadow-sm mb-2 flex items-start gap-3 shrink-0 ${isAdmin ? 'cursor-pointer hover:bg-amber-100 transition-colors' : ''}`}
                    onClick={() => {
                        if (isAdmin) {
                            setMemoInputValue(currentMemo);
                            setEditingMemoDate(selectedDate);
                        }
                    }}
                    title={isAdmin ? "クリックして編集" : ""}
                >
                    <div className="bg-amber-100 p-1.5 rounded-lg text-amber-600 shrink-0 mt-0.5">
                        <MessageSquare size={16} />
                    </div>
                    <div className="flex-1 whitespace-pre-wrap text-sm font-bold text-amber-900 leading-relaxed">
                        {currentMemo}
                    </div>
                    {isAdmin && <Pencil size={14} className="text-amber-400 shrink-0 mt-1" />}
                </div>
            );
        }

        if (isAdmin) {
            return (
                <div 
                    className="bg-slate-50 border border-dashed border-slate-300 p-3 md:p-4 rounded-2xl mb-2 text-center cursor-pointer hover:bg-slate-100 transition-colors text-slate-400 hover:text-slate-600 font-bold text-xs flex items-center justify-center gap-2 shrink-0"
                    onClick={() => {
                        setMemoInputValue("");
                        setEditingMemoDate(selectedDate);
                    }}
                >
                    <Plus size={14} /> 本日のメモ・共有事項を追加
                </div>
            );
        }

        return null;
      };

      return (
        <div className="flex flex-col md:flex-row app-shell bg-[#F8FAFC] text-slate-800 font-sans overflow-hidden" onClick={() => setContextMenu(null)} onContextMenu={() => setContextMenu(null)}>
          <aside className={`bg-slate-900 text-slate-300 hidden md:flex flex-col shrink-0 border-r border-slate-800 transition-all duration-300 relative ${isSidebarOpen ? 'w-72' : 'w-20'}`}>
            <button 
              onClick={() => setIsSidebarOpen(!isSidebarOpen)}
              className="absolute -right-3 top-8 bg-slate-800 text-slate-300 p-1.5 rounded-full border border-slate-700 hover:text-white hover:bg-slate-700 z-50 transition-colors"
            >
              {isSidebarOpen ? <ChevronLeft size={16} /> : <ChevronRight size={16} />}
            </button>
            <div className={`p-6 ${isSidebarOpen ? '' : 'flex flex-col items-center px-2'}`}>
              <div 
                className={`flex items-center gap-3 text-white font-black mb-2 ${isSidebarOpen ? 'text-2xl' : 'text-xl justify-center'} select-none`}
                onTouchStart={handleLogoPointerDown}
                onTouchEnd={handleLogoPointerUpOrLeave}
                onTouchMove={handleLogoPointerUpOrLeave}
                onTouchCancel={handleLogoPointerUpOrLeave}
                onMouseDown={handleLogoPointerDown}
                onMouseUp={handleLogoPointerUpOrLeave}
                onMouseLeave={handleLogoPointerUpOrLeave}
                onContextMenu={(e) => e.preventDefault()}
              >
                <div className="bg-teal-500 p-2 rounded-xl shadow-lg shadow-teal-500/20 shrink-0">
                  <Activity className="text-white" size={isSidebarOpen ? 24 : 20} />
                </div>
                {isSidebarOpen && <span>CareRoute</span>}
              </div>
              {isSidebarOpen && (
                <div className="flex flex-col gap-1 items-start mt-1">
                  <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest pl-1 whitespace-nowrap overflow-hidden">Route Optimization v2.5</p>
                  {isAdminUser ? (
                    <div className="flex items-center gap-1.5 ml-1">
                      <span className="bg-red-500/20 text-red-400 border border-red-500/30 text-[10px] px-2 py-0.5 rounded font-black">管理者モード</span>
                      <button onClick={handleLogout} className="text-[10px] font-black text-slate-400 hover:text-white border border-slate-600 px-2 py-0.5 rounded flex items-center gap-1 transition-colors" title={user?.email || ''}><LogOut size={10}/>ログアウト</button>
                    </div>
                  ) : (
                    <div className="flex items-center gap-1.5 ml-1">
                      <span className="bg-slate-700 text-slate-400 text-[10px] px-2 py-0.5 rounded font-black border border-slate-600">閲覧モード</span>
                      {wantsAdmin && <button onClick={() => { setLoginError(""); setShowLogin(true); }} className="text-[10px] font-black text-teal-300 hover:text-white border border-teal-700 px-2 py-0.5 rounded flex items-center gap-1 transition-colors"><LogIn size={10}/>ログイン</button>}
                    </div>
                  )}
                </div>
              )}
            </div>
            <nav className={`flex-1 space-y-1.5 mt-2 ${isSidebarOpen ? 'px-4' : 'px-2'}`}>
              <button onClick={() => setActiveTab('overview')} className={`w-full flex items-center ${isSidebarOpen ? 'justify-between px-5' : 'justify-center px-0'} py-4 rounded-2xl transition-all group ${activeTab === 'overview' ? 'bg-teal-600 text-white shadow-xl shadow-teal-900/30' : 'hover:bg-slate-800/50 hover:text-white'}`} title={!isSidebarOpen ? "全体スケジュール" : ""}>
                <div className={`flex items-center ${isSidebarOpen ? 'gap-4' : ''}`}>
                  <Columns size={22} className="shrink-0" />
                  {isSidebarOpen && <span className="font-bold whitespace-nowrap">全体スケジュール</span>}
                </div>
                {isSidebarOpen && <ChevronRight size={16} className={`opacity-0 group-hover:opacity-100 transition-opacity ${activeTab === 'overview' ? 'opacity-100' : ''}`} />}
              </button>
              <button onClick={() => setActiveTab('schedule')} className={`w-full flex items-center ${isSidebarOpen ? 'justify-between px-5' : 'justify-center px-0'} py-4 rounded-2xl transition-all group ${activeTab === 'schedule' ? 'bg-teal-600 text-white shadow-xl shadow-teal-900/30' : 'hover:bg-slate-800/50 hover:text-white'}`} title={!isSidebarOpen ? "個別ルート確認" : ""}>

                </div>
                <p className="text-xs font-bold text-slate-500 text-center mb-6 leading-relaxed">
                  いまのデータを、このファイルの内容で<span className="text-red-500 font-black">すべて置き換えます</span>。<br/>
                  実行前に、いまの状態を自動でファイルに保存します。
                </p>
                <div className="flex gap-3">
                  <button onClick={() => setRestoreCandidate(null)} disabled={archiveBusy} className="flex-1 py-4 rounded-2xl font-black text-slate-500 bg-slate-100 hover:bg-slate-200 transition-colors disabled:opacity-50">キャンセル</button>
                  <button onClick={executeRestore} disabled={archiveBusy} className="flex-1 py-4 rounded-2xl font-black text-white bg-amber-500 hover:bg-amber-600 transition-colors shadow-lg shadow-amber-500/30 disabled:opacity-50">{archiveBusy ? "復元中…" : "復元する"}</button>
                </div>
              </div>
            </div>
          )}

          {showToast && (
            <div onClick={() => setShowToast(false)} className="fixed bottom-20 right-3 left-3 md:left-auto md:bottom-10 md:right-10 glass-effect text-slate-900 px-4 py-3 md:px-8 md:py-5 rounded-[1.25rem] md:rounded-[2rem] shadow-2xl flex items-center gap-3 md:gap-4 z-[500] border border-white shadow-teal-500/20 cursor-pointer max-w-[90vw]">
              <div className="bg-emerald-500 p-1.5 md:p-2 rounded-lg md:rounded-xl text-white shadow-lg shadow-emerald-200 shrink-0">
                <CheckCircle2 size={20} className="md:w-6 md:h-6" />
              </div>
              <span className="font-black text-xs md:text-sm tracking-tight leading-relaxed">{toastMessage}</span>
            </div>
          )}
          
          {seasonalEffect && (
            <div className="fixed bottom-36 right-6 md:bottom-28 md:right-10 z-[90] animate-[bounce_3s_infinite] pointer-events-none flex flex-col items-center transition-all duration-500 hover:scale-110">
              <div className="text-4xl md:text-5xl drop-shadow-2xl">{seasonalEffect.icon}</div>
              <div className="text-[10px] font-black text-slate-600 bg-white/90 border border-slate-200 px-3 py-1 rounded-full mt-2 shadow-lg backdrop-blur-sm whitespace-nowrap">
                {seasonalEffect.text}
              </div>
            </div>
          )}
        </div>
      );
    }
    
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
