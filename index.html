  <style>
    /* 画面回転時のテキストサイズ自動調整を防止 */
    html { -webkit-text-size-adjust: 100%; }
    
    /* スムーズなスクロール */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* モバイルでのタップ感向上 */
    button, select, input { touch-action: manipulation; }
    
    /* モバイルでの入力時ズーム防止（フォントサイズ16px以上） */

      input, select, textarea { font-size: 16px !important; }

    .timeline-shadow { box-shadow: inset -10px 0 10px -10px rgba(0,0,0,0.1); }
    
    /* カード内のテキストが消えないよう最小高さを確保し、スマホの長押し標準メニューを無効化 */
    .visit-card { 
      min-height: 36px; 
      display: flex; 
      flex-direction: column; 
      -webkit-touch-callout: none;
      user-select: none;
    }

    @media (max-width: 767px) {
      .mobile-dynamic-h {
        min-height: var(--card-min-h);
      }
    }

    /* PC表示時は横スクロールバーを表示（モバイルでは隠す） */
    @media (min-width: 768px) {
      .visit-card {
        min-height: 48px;
      }
      .pc-scrollable::-webkit-scrollbar { display: block !important; height: 6px; }
      .pc-scrollable::-webkit-scrollbar-track { background: rgba(0,0,0,0.03); border-radius: 8px; margin: 0 4px; }
      .pc-scrollable::-webkit-scrollbar-thumb { background-color: rgba(148, 163, 184, 0.5); border-radius: 8px; }

      .pc-scrollable { -ms-overflow-style: auto !important; scrollbar-width: thin !important; scrollbar-color: rgba(148, 163, 184, 0.5) transparent !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useMemo, useRef, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Calendar, Users, Map as MapIcon, Clock, MapPin, RefreshCw, Plus, Trash2, ArrowRight, ArrowDown, CheckCircle2, UserPlus, Activity, Upload, AlertTriangle, CalendarDays, Link as LinkIcon, UserCog, Columns, Settings2, ChevronUp, ChevronDown, ArrowUpDown, ChevronRight, ChevronLeft, ChevronsLeft, ChevronsRight, Undo, Lock, Unlock, Briefcase, X, BarChart3, Pencil, MessageSquare, Copy, RotateCcw, MoreVertical } from 'lucide-react';
    
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
    import * as _LZ from 'https://esm.sh/lz-string@1.5.0';
    const LZString = (_LZ && _LZ.default && _LZ.default.compressToBase64) ? _LZ.default : _LZ;

    // 大きなフィールド（visits / savedPatterns）を圧縮して保存し、
    // Firestoreの「1ドキュメント約1MB」上限に引っかからないようにする。
    const COMPRESS_PREFIX = 'LZ:';
    const encodeField = (obj) => {
      const json = JSON.stringify(obj);
      try {
        if (LZString && typeof LZString.compressToBase64 === 'function') {
          return COMPRESS_PREFIX + LZString.compressToBase64(json);
        }
      } catch (e) { console.error("compress failed:", e); }
      return json; // 圧縮不可のときは従来どおり素のJSONで保存
    };
    const decodeField = (str, fallback) => {
      if (str == null) return fallback;
      try {
        if (typeof str === 'string' && str.startsWith(COMPRESS_PREFIX)) {
          const json = LZString.decompressFromBase64(str.slice(COMPRESS_PREFIX.length));
          return json ? JSON.parse(json) : fallback;
        }
        return JSON.parse(str); // 旧形式（非圧縮のJSON文字列）
      } catch (e) {
        console.error("decodeField failed:", e);
        return fallback;
      }
    };

    const myFirebaseConfig = {
      apiKey: "AIzaSyBQFSkTTh582w-WwlfU6mwejs8rPAGrm8M",
      authDomain: "care-route-app.firebaseapp.com",
      projectId: "care-route-app",
      storageBucket: "care-route-app.firebasestorage.app",
      messagingSenderId: "1086680205439",
      appId: "1:1086680205439:web:d0a6a39a25555b7ae3174a"
    };

    let app, auth, db, appId;
    try {
      const envFirebaseConfig = typeof window.__firebase_config !== 'undefined' ? window.__firebase_config : null;
      if (envFirebaseConfig) {
        const firebaseConfig = typeof envFirebaseConfig === 'string' ? JSON.parse(envFirebaseConfig) : envFirebaseConfig;
        app = initializeApp(firebaseConfig);
        appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'default-app-id';
      } else {
        app = initializeApp(myFirebaseConfig);
        appId = myFirebaseConfig.projectId;
      }
      if (app) {
        auth = getAuth(app);
        db = getFirestore(app);
      }
    } catch (e) { console.error("Firebase init error", e); }

    const START_HOUR = 7;
    const END_HOUR = 22;
    const PIXELS_PER_MINUTE = 2.0; 
    const getTop = (minutes) => (minutes - START_HOUR * 60) * PIXELS_PER_MINUTE;

    const parseTime = (timeStr) => {
      if (!timeStr) return 0;
      const parts = timeStr.split(':');
      return parseInt(parts[0]) * 60 + parseInt(parts[1]);
    };

    const formatTime = (minutes) => {
      if (isNaN(minutes)) return "00:00";
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    };

    const normalizeName = (name) => name?.replace(/[\s　]/g, '').replace(/様$/, '') || "";
    const getHashLoc = (str) => {
      let hash = 0;
      for (let i = 0; i < str.length; i++) { hash = str.charCodeAt(i) + ((hash << 5) - hash); }
      return { x: Math.abs(hash % 80) + 10, y: Math.abs((hash >> 3) % 80) + 10 };
    };

    const DISPLAY_DAYS = ['月', '火', '水', '木', '金', '土', '日'];
    const JS_DAYS = ['日', '月', '火', '水', '木', '金', '土'];

    const colors = ['#0ea5e9', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#ef4444', '#14b8a6'];

    const DEFAULT_USER_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQI0jwy-uuQLiFhL8v2lQOZyPUAbi2zEdcFQ5L0Kj1FID4uft8tJNgwK1_1p5njDouz4gnAgVWE6dc7/pub?gid=0&single=true&output=csv";
    const DEFAULT_NURSE_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQI0jwy-uuQLiFhL8v2lQOZyPUAbi2zEdcFQ5L0Kj1FID4uft8tJNgwK1_1p5njDouz4gnAgVWE6dc7/pub?gid=1876217961&single=true&output=csv";

    const formatDateLabel = (dateStr) => {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      return `${d.getMonth() + 1}/${d.getDate()}(${JS_DAYS[d.getDay()]})`;
    };

    const isNurseOff = (nurse, dateStr) => {
      if (!nurse || !dateStr) return false;
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return false;
      const jsDayOfWeek = d.getDay();
      
      if (nurse.offDays && nurse.offDays.includes(jsDayOfWeek)) return true;
      if (nurse.specificOffDays && nurse.specificOffDays.includes(dateStr)) return true;
      
      return false;
    };

    const getTodayStr = () => {
      const d = new Date();
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().split('T')[0];
    };
    
    const getMondayStr = (dateStr) => {
      const d = new Date(dateStr);
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      return d.toISOString().split('T')[0];
    };

    const useDragScroll = () => {
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;

        let isDown = false;
        let startX;
        let scrollLeft;

        const onMouseDown = (e) => {
          isDown = true;
          startX = e.pageX - el.offsetLeft;
          scrollLeft = el.scrollLeft;
        };
        const onMouseLeave = () => {
          isDown = false;
        };
        const onMouseUp = () => {
          isDown = false;
        };
        const onMouseMove = (e) => {
          if (!isDown) return;
          e.preventDefault();
          const x = e.pageX - el.offsetLeft;
          const walk = (x - startX) * 2; 
          el.scrollLeft = scrollLeft - walk;
        };
        const onWheel = (e) => {
          if (e.deltaY !== 0 && !e.shiftKey) {
             const isAtLeft = el.scrollLeft <= 0 && e.deltaY < 0;
             const isAtRight = Math.ceil(el.scrollLeft + el.clientWidth) >= el.scrollWidth && e.deltaY > 0;
             if (!isAtLeft && !isAtRight) {
               e.preventDefault();
               el.scrollLeft += e.deltaY;
             }
          }
        };

        el.addEventListener('mousedown', onMouseDown);
        el.addEventListener('mouseleave', onMouseLeave);
        el.addEventListener('mouseup', onMouseUp);
        el.addEventListener('mousemove', onMouseMove);
        el.addEventListener('wheel', onWheel, { passive: false });

        return () => {
          el.removeEventListener('mousedown', onMouseDown);
          el.removeEventListener('mouseleave', onMouseLeave);
          el.removeEventListener('mouseup', onMouseUp);
          el.removeEventListener('mousemove', onMouseMove);
          el.removeEventListener('wheel', onWheel);
        };
      }, []);

      return ref;
    };

    function App() {
      const isAdmin = useMemo(() => {
        if (typeof window === 'undefined') return false;
        const params = new URLSearchParams(window.location.search);
        return params.get('mode') === 'admin';
      }, []);

      const scrollRefHeader1 = useDragScroll();
      const scrollRefHeader2 = useDragScroll();
      const scrollRefOverview = useDragScroll();
      const scrollRefSchedule = useDragScroll();

      const [user, setUser] = useState(null);
      const [isSyncing, setIsSyncing] = useState(false);
      
      const [activeTab, setActiveTab] = useState(() => {
        return localStorage.getItem('careRoute_activeTab') || 'overview';
      });
      
      useEffect(() => {
        localStorage.setItem('careRoute_activeTab', activeTab);
      }, [activeTab]);
      
      const [isSidebarOpen, setIsSidebarOpen] = useState(true);
      
      const longPressTimer = useRef(null);
      const logoTimerRef = useRef(null);

      const [autoAssignClickCount, setAutoAssignClickCount] = useState(0);
      const [autoAssignFunnyMessage, setAutoAssignFunnyMessage] = useState("");
      const autoAssignTimerRef = useRef(null);

      const [startDate, setStartDate] = useState(() => {
        const saved = localStorage.getItem('careRoute_startDate');
        return saved || getMondayStr(getTodayStr());
      });
      const [selectedDate, setSelectedDate] = useState(() => {
        const saved = localStorage.getItem('careRoute_selectedDate');
        return saved || getTodayStr();
      });

      const handleGoToToday = () => {
        const today = getTodayStr();
        setSelectedDate(today);
        setStartDate(getMondayStr(today));
      };

      useEffect(() => {
        if (startDate) localStorage.setItem('careRoute_startDate', startDate);
      }, [startDate]);

      useEffect(() => {
        if (selectedDate) localStorage.setItem('careRoute_selectedDate', selectedDate);
      }, [selectedDate]);
      
      const [reportMonth, setReportMonth] = useState(() => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      });
      
      const [nurses, setNurses] = useState([]);
      const [visits, setVisits] = useState([]);
      const [nurseStatuses, setNurseStatuses] = useState([]); 
      const [savedPatterns, setSavedPatterns] = useState({});
      const [history, setHistory] = useState([]);
      const [dailyMemos, setDailyMemos] = useState({});
      
      const [baseTravelTime, setBaseTravelTime] = useState(7);
      const [selectedNurseId, setSelectedNurseId] = useState(() => {
        const saved = localStorage.getItem('careRoute_selectedNurseId');
        return saved ? parseInt(saved, 10) : null;
      });

      useEffect(() => {
        if (selectedNurseId !== null) {
          localStorage.setItem('careRoute_selectedNurseId', selectedNurseId);
        }
      }, [selectedNurseId]);

      const [isOptimizing, setIsOptimizing] = useState(false);
      const [showToast, setShowToast] = useState(false);
      const [toastMessage, setToastMessage] = useState("");
      const [visitSortConfig, setVisitSortConfig] = useState({ key: 'startTime', direction: 'asc' });

      const [sheetUrl, setSheetUrl] = useState(DEFAULT_USER_SHEET_URL);
      const [nurseSheetUrl, setNurseSheetUrl] = useState(DEFAULT_NURSE_SHEET_URL);
      const [isLoadingSheet, setIsLoadingSheet] = useState(false);
      const [isLoadingNurseSheet, setIsLoadingNurseSheet] = useState(false);
      
      const [showResetConfirm, setShowResetConfirm] = useState(false);
      const [activeCardId, setActiveCardId] = useState(null);

      const [showAddEventModal, setShowAddEventModal] = useState(false);
      const [deleteConfirmId, setDeleteConfirmId] = useState(null);
      const [activePatternSlot, setActivePatternSlot] = useState(null);
      
      const [editingVisit, setEditingVisit] = useState(null);
      const [contextMenu, setContextMenu] = useState(null);

      const [editingMemoDate, setEditingMemoDate] = useState(null);
      const [memoInputValue, setMemoInputValue] = useState("");

      const addEventTitleInputRef = useRef(null);
      const migratedRef = useRef(false); // 旧データの圧縮移行を一度だけ実行するためのフラグ

      // 設定のアコーディオン用の状態
      const [showVisitSettings, setShowVisitSettings] = useState(false);
      const [showNurseSettings, setShowNurseSettings] = useState(false);

      useEffect(() => {
        if (showToast) {
          const timer = setTimeout(() => setShowToast(false), 4000);
          return () => clearTimeout(timer);
        }
      }, [showToast]);

      useEffect(() => {
        if (showAddEventModal) {
          const timer = setTimeout(() => {
            addEventTitleInputRef.current?.focus();
          }, 100);
          return () => clearTimeout(timer);
        }
      }, [showAddEventModal]);

      useEffect(() => {
        if (!auth) return;
        const initAuth = async () => {
          try {
            const initialToken = typeof window.__initial_auth_token !== 'undefined' ? window.__initial_auth_token : null;
            if (initialToken) { await signInWithCustomToken(auth, initialToken); } 
            else { await signInAnonymously(auth); }
          } catch (e) { console.error("Auth error", e); }
        };
        initAuth();
        const unsubscribe = onAuthStateChanged(auth, setUser);
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user || !db) return;
        setIsSyncing(true);
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'careRoute_state', 'main');
        const unsubscribe = onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.nurses) setNurses(JSON.parse(data.nurses));
            if (data.visits != null) setVisits(decodeField(data.visits, []));
            if (data.nurseStatuses != null) setNurseStatuses(decodeField(data.nurseStatuses, []));
            if (data.savedPatterns != null) setSavedPatterns(decodeField(data.savedPatterns, {}));
            if (data.dailyMemos) setDailyMemos(JSON.parse(data.dailyMemos));
            if (data.sheetUrl) setSheetUrl(data.sheetUrl);
            if (data.nurseSheetUrl) setNurseSheetUrl(data.nurseSheetUrl);
            if (data.baseTravelTime !== undefined) setBaseTravelTime(data.baseTravelTime);

            // 旧形式（非圧縮）のデータを検出したら、圧縮形式へ一度だけ移行する
            const isRawJson = (s) => typeof s === 'string' && s.length > 0 && !s.startsWith(COMPRESS_PREFIX);
            const visitsRaw = data.visits;
            const patternsRaw = data.savedPatterns;
            const statusesRaw = data.nurseStatuses;
            const needsMigration = isRawJson(visitsRaw) || isRawJson(patternsRaw) || isRawJson(statusesRaw);
            if (isAdmin && needsMigration && !migratedRef.current && LZString && typeof LZString.compressToBase64 === 'function') {
              migratedRef.current = true;
              updateCloudData({
                visits: encodeField(decodeField(visitsRaw, [])),
                savedPatterns: encodeField(decodeField(patternsRaw, {})),
                nurseStatuses: encodeField(decodeField(statusesRaw, []))
              });
            }
          } else {
            setDoc(docRef, { nurses: "[]", visits: "[]", nurseStatuses: "[]", savedPatterns: "{}", dailyMemos: "{}", sheetUrl: DEFAULT_USER_SHEET_URL, nurseSheetUrl: DEFAULT_NURSE_SHEET_URL, baseTravelTime: 7 });
          }
          setIsSyncing(false);
        }, (err) => { console.error(err); setIsSyncing(false); });
        return () => unsubscribe();
      }, [user]);

      // ドキュメント全体のおおよそのバイト数を見積もる（Firestoreの上限は1ドキュメント約1MB）
      const estimateDocSize = (override = {}) => {
        const fields = {
          nurses: JSON.stringify(nurses),
          visits: encodeField(visits),
          nurseStatuses: encodeField(nurseStatuses),
          savedPatterns: encodeField(savedPatterns),
          dailyMemos: JSON.stringify(dailyMemos),
          sheetUrl: sheetUrl,
          nurseSheetUrl: nurseSheetUrl,
          baseTravelTime: String(baseTravelTime),
          ...override
        };
        let bytes = 0;
        for (const key in fields) {
          const val = fields[key] == null ? "" : String(fields[key]);
          // フィールド名 + 値のUTF-8バイト数を概算
          bytes += key.length + (typeof TextEncoder !== 'undefined' ? new TextEncoder().encode(val).length : val.length);
        }
        return bytes;
      };

      const updateCloudData = (newData) => {
        if (!isAdmin) return;
        if (user && db) {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'careRoute_state', 'main');
          setDoc(docRef, newData, { merge: true }).catch(e => {
            console.error("Firestore write failed:", e);
            const size = estimateDocSize(newData);
            const overLimit = size > 1048487; // 1MiB (1048576) - 余裕分
            let msg;
            if (e.code === 'resource-exhausted' || e.code === 'invalid-argument' || e.code === 'out-of-range' || overLimit) {
              msg = `保存できませんでした：データ量が上限（約1MB）に達しています（現在 約${Math.round(size / 1024)}KB）。過去の予定やメモリ保存の整理が必要です。`;
            } else if (e.code === 'permission-denied') {
              msg = "保存できませんでした：データベースへの書き込みが許可されていません（Firestoreのセキュリティルールをご確認ください）。";
            } else if (e.code === 'unavailable' || e.code === 'deadline-exceeded') {
              msg = "保存できませんでした：ネットワークに接続できません。通信環境をご確認ください。";
            } else {
              msg = `保存に失敗しました：${e.message || e.code || "不明なエラー"}`;
            }
            setToastMessage(msg);
            setShowToast(true);
          });
        }
      };

      const handleSetVisits = (newVal) => {
        if (!isAdmin) return;
        setVisits(prev => {
          const next = typeof newVal === 'function' ? newVal(prev) : newVal;
          updateCloudData({ visits: encodeField(next) });
          return next;
        });
      };

      const handleSetNurses = (newVal) => {
        if (!isAdmin) return;
        setNurses(prev => {
          const next = typeof newVal === 'function' ? newVal(prev) : newVal;
          updateCloudData({ nurses: JSON.stringify(next) });
          return next;
        });
      };

      const handleSetNurseStatuses = (newVal) => {
        if (!isAdmin) return;
        setNurseStatuses(prev => {
          const next = typeof newVal === 'function' ? newVal(prev) : newVal;
          updateCloudData({ nurseStatuses: encodeField(next) });
          return next;
        });
      };

      const handleSetSavedPatterns = (newVal) => {
        if (!isAdmin) return;
        setSavedPatterns(prev => {
          const next = typeof newVal === 'function' ? newVal(prev) : newVal;
          updateCloudData({ savedPatterns: encodeField(next) });
          return next;
        });
      };

      const handleSetDailyMemo = (date, text) => {
        if (!isAdmin) return;
        setDailyMemos(prev => {
          const next = { ...prev, [date]: text };
          updateCloudData({ dailyMemos: JSON.stringify(next) });
          return next;
        });
      };

      const saveHistory = () => {
        if (!isAdmin) return;
        setHistory(prev => {
          const newHistory = [...prev, { visits: JSON.parse(JSON.stringify(visits)), nurseStatuses: JSON.parse(JSON.stringify(nurseStatuses)) }];
          if (newHistory.length > 20) newHistory.shift();
          return newHistory;
        });
      };

      const handleUndo = () => {
        if (!isAdmin) return;
        setHistory(prev => {
          if (prev.length === 0) return prev;
          const nextHistory = [...prev];
          const previousState = nextHistory.pop();
          
          handleSetVisits(previousState.visits);
          handleSetNurseStatuses(previousState.nurseStatuses);
          
          setToastMessage("直前の操作を取り消しました");
          setShowToast(true);
          
          return nextHistory;
        });
      };

      const handleSetBaseTravelTime = (v) => { if(!isAdmin) return; setBaseTravelTime(v); updateCloudData({ baseTravelTime: v }); };
      const handleSheetUrlChange = (e) => { if(!isAdmin) return; setSheetUrl(e.target.value); updateCloudData({ sheetUrl: e.target.value }); };
      const handleNurseSheetUrlChange = (e) => { if(!isAdmin) return; setNurseSheetUrl(e.target.value); updateCloudData({ nurseSheetUrl: e.target.value }); };
      
      const handleSetStartDate = (dateStr) => {
        setStartDate(dateStr);
      };

      const displayDates = useMemo(() => {
        if (!startDate) return [];
        const dates = [];
        const start = new Date(startDate);
        
        const startJsDay = start.getDay();
        const diffToMonday = startJsDay === 0 ? -6 : 1 - startJsDay;
        start.setDate(start.getDate() + diffToMonday);

        for (let i = 0; i < 7; i++) {
          const d = new Date(start);
          d.setDate(d.getDate() + i);
          dates.push(d.toISOString().split('T')[0]);
        }
        return dates;
      }, [startDate]);

      const handlePrevWeek = () => {
        if (!startDate) return;
        const d = new Date(startDate);
        d.setDate(d.getDate() - 7);
        handleSetStartDate(d.toISOString().split('T')[0]);
        
        const s = new Date(selectedDate);
        s.setDate(s.getDate() - 7);
        setSelectedDate(s.toISOString().split('T')[0]);

      const handlePrevDay = () => {

        d.setDate(d.getDate() - 1);

        if (displayDates.length > 0 && newDate < displayDates[0]) {

           start.setDate(start.getDate() - 7);
           handleSetStartDate(start.toISOString().split('T')[0]);

        setSelectedDate(newDate);

      const getIsNurseOffType = (nurse, dateStr, statuses) => {
        if (!nurse) return 'work';
        const override = statuses.find(s => s.date === dateStr && s.nurseId === nurse.id);
        if (override && override.status) {
            if (override.status === 'off') return 'full';
            if (override.status === 'am_off') return 'AM';
            if (override.status === 'pm_off') return 'PM';
            if (override.status === 'work') return 'work';
        }
        
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return 'work';
        const jsDayOfWeek = d.getDay();
        
        if (nurse.specificOffDays) {
            const spec = nurse.specificOffDays.find(s => typeof s === 'string' ? s === dateStr : s.date === dateStr);
            if (spec) return typeof spec === 'string' ? 'full' : spec.type;
        }
        
        if (nurse.offDays) {
            const off = nurse.offDays.find(o => typeof o === 'number' ? o === jsDayOfWeek : o.day === jsDayOfWeek);
            if (off) return typeof off === 'number' ? 'full' : off.type;
        }
        
        return 'work';
      };

      const selectedNurse = useMemo(() => nurses.find(n => n.id === selectedNurseId) || nurses[0], [nurses, selectedNurseId]);
      const selectedNurseOffType = selectedNurse ? getIsNurseOffType(selectedNurse, selectedDate, nurseStatuses) : 'work';

      const unassignedCount = visits.filter(v => v.date === selectedDate && v.nurseId === null).length;
      
      const hasAssignedVisits = useMemo(() => {

      const latestSyncedDate = useMemo(() => {
        if (!visits || visits.length === 0) return null;
        const dates = visits.map(v => v.date).filter(Boolean);
        if (dates.length === 0) return null;
        return dates.reduce((a, b) => a > b ? a : b);
      }, [visits]);

      const allSchedules = useMemo(() => {
        const schedules = {};
        nurses.forEach(nurse => {
          const offType = getIsNurseOffType(nurse, selectedDate, nurseStatuses);
          if (offType === 'full') { schedules[nurse.id] = { isOff: true, offType: 'full', visits: [], calculatedStartTime: nurse.startTime }; return; }
          
          const assigned = visits.filter(v => v.nurseId === nurse.id && v.date === selectedDate);
          const sorted = [...assigned].sort((a, b) => parseTime(a.startTime) - parseTime(b.startTime));
          
          let workStartTimeMin = parseTime(nurse.startTime);
          let workEndTimeMin = parseTime(nurse.endTime || '17:30');
          
          if (offType === 'AM') {
              workStartTimeMin = parseTime('13:30');
              workEndTimeMin = parseTime('17:30');
          } else if (offType === 'PM') {
              workStartTimeMin = parseTime('08:00');
              workEndTimeMin = parseTime('12:30');
          }

          let currentTime = workStartTimeMin;
          let calculatedStartTime = currentTime;
          let calcVisits = [];
          let currentLoc = nurse.startLocation || {x:50, y:50};
          
          sorted.forEach((visit, idx) => {
            const dist = Math.sqrt(Math.pow((visit.location?.x || 50) - currentLoc.x, 2) + Math.pow((visit.location?.y || 50) - currentLoc.y, 2));
            const travelTime = visit.customTravelTime ?? (baseTravelTime + Math.round(dist * 0.05));
            
            if (idx === 0) {
              const targetStart = parseTime(visit.startTime);
              if (targetStart - travelTime > currentTime) {
                currentTime = targetStart - travelTime;
                calculatedStartTime = currentTime;
              }
            }

            const arrivalTime = currentTime + travelTime;
            const actualStart = Math.max(arrivalTime, parseTime(visit.startTime));
            
            calcVisits.push({ 
              ...visit, 
              travelTime, 
              isLate: arrivalTime > parseTime(visit.startTime), 
              waitTime: actualStart - arrivalTime, 
              arrivalTime: formatTime(arrivalTime), 
              actualStartTime: formatTime(actualStart), 
              departureTime: formatTime(actualStart + visit.duration) 
            });
            currentTime = actualStart + visit.duration; 
            currentLoc = visit.location || {x: 50, y: 50};
          });
          
          let finalTravelTime = 0, returnTime = null;
          if (calcVisits.length > 0) {
            finalTravelTime = baseTravelTime + Math.round(Math.sqrt(Math.pow(currentLoc.x - (nurse.startLocation?.x || 50), 2) + Math.pow(currentLoc.y - (nurse.startLocation?.y || 50), 2)) * 0.05);
            returnTime = formatTime(currentTime + finalTravelTime);
          } else {
            returnTime = formatTime(workStartTimeMin);
          }
          schedules[nurse.id] = { 
            isOff: false, 
            offType, 
            visits: calcVisits, 
            returnTime, 
            finalTravelTime, 
            calculatedStartTime: formatTime(calculatedStartTime),
            workStartTimeStr: formatTime(workStartTimeMin),
            workEndTimeMin: workEndTimeMin
          };
        });
        return schedules;
      }, [nurses, visits, selectedDate, baseTravelTime, nurseStatuses]);

      const stats = useMemo(() => {

        if (sch.length > 0 && selectedNurse && selectedNurseOffType !== 'full') { tt += allSchedules[selectedNurse.id]?.finalTravelTime || 0; }
        return { totalTravel: tt, totalVisit: tv, count: sch.length, lateCount: lc };

      const unassignedVisitsWithLayout = useMemo(() => {
        const filtered = visits.filter(v => v.date === selectedDate && v.nurseId === null).sort((a, b) => parseTime(a.startTime) - parseTime(b.startTime));
        
        const groups = [];
        let currentGroup = [];
        let groupEnd = 0;
        
        filtered.forEach(visit => {
          const start = parseTime(visit.startTime);
          const end = start + Math.max(visit.duration, 24); 
          
          if (currentGroup.length === 0) {
            currentGroup.push(visit);
            groupEnd = end;
          } else {
            if (start < groupEnd) {
              currentGroup.push(visit);
              groupEnd = Math.max(groupEnd, end);
            } else {
              groups.push(currentGroup);
              currentGroup = [visit];
              groupEnd = end;
            }
          }
        });
        if (currentGroup.length > 0) groups.push(currentGroup);
        
        const layouted = [];
        groups.forEach(group => {
          const cols = [];
          group.forEach(visit => {
            const start = parseTime(visit.startTime);
            let placed = false;
            for(let i = 0; i < cols.length; i++){
               const lastInCol = cols[i][cols[i].length - 1];
               const lastEnd = parseTime(lastInCol.startTime) + Math.max(lastInCol.duration, 24);
               if (lastEnd <= start) {
                 cols[i].push(visit);
                 visit._col = i;
                 placed = true;
                 break;
               }
            }
            if(!placed){
              visit._col = cols.length;
              cols.push([visit]);
            }
          });
          
          group.forEach(visit => {
            layouted.push(visit);
          });
        });
        
        return layouted;
      }, [visits, selectedDate]);

        let monthlyUnassignedDuration = 0;

        for (let d = 1; d <= daysInMonth; d++) {

          const dayVisits = visits.filter(v => v.date === dateStr);
          
          const realVisits = dayVisits.filter(v => v.type !== 'other');
          
          const dailyTotal = realVisits.length;
          let dailyTotalDuration = 0;
          monthlyTotal += dailyTotal;

          const nurseCounts = {};
          const nurseDurations = {};
          nurses.forEach(n => {
              nurseCounts[n.id] = 0;
              nurseDurations[n.id] = 0;
          });
          let unassigned = 0;
          let unassignedDuration = 0;

          realVisits.forEach(v => {
            const dur = v.duration || 0;
            dailyTotalDuration += dur;
            monthlyTotalDuration += dur;

            if (v.nurseId) {
              nurseCounts[v.nurseId] = (nurseCounts[v.nurseId] || 0) + 1;
              monthlyNurseTotals[v.nurseId] = (monthlyNurseTotals[v.nurseId] || 0) + 1;
              
              nurseDurations[v.nurseId] += dur;
              monthlyNurseDurations[v.nurseId] += dur;
            } else {
              unassigned++;
              monthlyUnassigned++;
              unassignedDuration += dur;
              monthlyUnassignedDuration += dur;
            }
          });

          const jsDay = new Date(year, month - 1, d).getDay();

          dailyStats.push({
            dateStr,
            day: d,
            jsDay,
            total: dailyTotal,
            totalDuration: dailyTotalDuration,
            unassigned,
            unassignedDuration,
            nurseCounts,
            nurseDurations
          });
        }

        return {
          dailyStats,
          monthlyTotal,
          monthlyTotalDuration,
          monthlyNurseTotals,
          monthlyNurseDurations,
          monthlyUnassigned,
          monthlyUnassignedDuration
        };

        else if (currentOffType === 'AM') nextStatus = 'off';
        else if (currentOffType === 'full') nextStatus = 'work';

        saveHistory();
        handleSetNurseStatuses(prev => {
          const next = [...prev];
          const idx = next.findIndex(s => s.date === dateStr && s.nurseId === nurseId);
          if (idx !== -1) {
            if (next[idx].isLocked) return next; 
            next[idx] = { ...next[idx], status: nextStatus };
          } else {
            next.push({ date: dateStr, nurseId, status: nextStatus, isLocked: false });
          }
          return next;
        });

        // 休み設定時の訪問予定の自動解除ロジックも新しいステータスに合わせて調整
        if (nextStatus !== 'work') {
          handleSetVisits(prev => prev.map(v => {
            if (v.date === dateStr && v.nurseId === nurseId && !v.isExcludedFromAutoAssign) {
                const targetStart = parseTime(v.startTime);
                const shouldUnassign = 
                  (nextStatus === 'off') || 
                  (nextStatus === 'am_off' && targetStart < parseTime('13:30')) ||
                  (nextStatus === 'pm_off' && targetStart >= parseTime('12:30'));
                
                if (shouldUnassign) {
                  return { ...v, nurseId: null, startTime: v.originalStartTime || v.startTime, customTravelTime: null };
                }
            }
            return v;
          }));
        }
      };
      const toggleNurseLock = (nurseId, dateStr) => {
        if (!isAdmin) return;
        saveHistory();
        handleSetNurseStatuses(prev => {
          const next = [...prev];
          const idx = next.findIndex(s => s.date === dateStr && s.nurseId === nurseId);
          if (idx !== -1) {
            next[idx] = { ...next[idx], isLocked: !next[idx].isLocked };
          } else {
            const nurse = nurses.find(n => n.id === nurseId);
            const offType = getIsNurseOffType(nurse, dateStr, []);
            let st = 'work';
            if(offType==='full') st='off';
            else if(offType==='AM') st='am_off';
            else if(offType==='PM') st='pm_off';
            next.push({ date: dateStr, nurseId, status: st, isLocked: true });
          }
          return next;
        });
      };

      const handleLockAllToday = () => {
        if (!isAdmin) return;
        saveHistory();
        handleSetVisits(prev => prev.map(v => 
          v.date === selectedDate ? { ...v, isExcludedFromAutoAssign: true } : v
        ));

        const currentStatuses = nurses.map(n => {
          const offType = getIsNurseOffType(n, selectedDate, nurseStatuses);
          let st = 'work';
          if(offType==='full') st='off';
          else if(offType==='AM') st='am_off';
          else if(offType==='PM') st='pm_off';
          return { date: selectedDate, nurseId: n.id, status: st, isLocked: true };
        });
        
        handleSetNurseStatuses(prev => {
          let next = [...prev];
          currentStatuses.forEach(cs => {
            const idx = next.findIndex(s => s.date === cs.date && s.nurseId === cs.nurseId);
            if (idx !== -1) {
              next[idx] = { ...next[idx], ...cs };
            } else {
              next.push(cs);
            }
          });
          return next;
        });

        setToastMessage("表示中の予定と出勤状況をすべて固定しました");
        setShowToast(true);
      };

      const handleUnlockAllToday = () => {
        if (!isAdmin) return;
        saveHistory();
        handleSetVisits(prev => prev.map(v => 
          v.date === selectedDate ? { ...v, isExcludedFromAutoAssign: false } : v
        ));
        
        handleSetNurseStatuses(prev => prev.map(s => 
          s.date === selectedDate ? { ...s, isLocked: false } : s
        ));

        setToastMessage("表示中の固定をすべて解除しました");
        setShowToast(true);
      };

      const handleAutoAssign = () => {
        if (!isAdmin) return;
        const availableStates = [];
        nurses.forEach(n => {
            const offType = getIsNurseOffType(n, selectedDate, nurseStatuses);
            if (offType !== 'full') {
                availableStates.push({ nurse: n, offType });
            }
        });

        if (availableStates.length === 0) { setToastMessage("出勤者がいません"); setShowToast(true); return; }
        
        saveHistory();
        setIsOptimizing(true);
        
        setTimeout(() => {
          try {
            const newVisits = [...visits];
            const todayUnassigned = newVisits.filter(v => v.date === selectedDate && v.nurseId === null && !v.isExcludedFromAutoAssign).sort((a,b) => parseTime(a.startTime) - parseTime(b.startTime));
            
            const states = availableStates.map(({nurse: n, offType}) => {
              const mine = newVisits.filter(v => v.date === selectedDate && v.nurseId === n.id).sort((a,b) => parseTime(a.startTime) - parseTime(b.startTime));
              const last = mine.length > 0 ? mine[mine.length - 1] : null;
              
              let totalDuration = 0;
              let amDuration = 0;
              let pmDuration = 0;
              mine.forEach(v => {
                  const dur = v.duration || 30;
                  totalDuration += dur;
                  if (parseTime(v.startTime) < 12 * 60) {
                      amDuration += dur;
                  } else {
                      pmDuration += dur;
                  }
              });
              
              let startTimeMin = parseTime(n.startTime);
              let endTimeMin = parseTime(n.endTime || '17:30');

              if (offType === 'AM') {
                  startTimeMin = parseTime('13:30');
                  endTimeMin = parseTime('17:30');
              } else if (offType === 'PM') {
                  startTimeMin = parseTime('08:00');
                  endTimeMin = parseTime('12:30');
              }

              let time = last ? parseTime(last.startTime) + (last.duration || 30) : startTimeMin;

              return { 
                  id: n.id, 
                  offType,
                  time, 
                  loc: last && last.location ? last.location : (n.startLocation || {x: 50, y: 50}),
                  totalDuration,
                  amDuration,
                  pmDuration,
                  visitCount: mine.length,
                  startTimeMin,
                  endTimeMin
              };
            });
            
            let assignedCount = 0;

            todayUnassigned.forEach(visit => {
              let best = null;
              
              const requiresFemale = visit.requiresFemaleNurse;
              const preferredNurseNames = visit.preferredNurseNames || [];
              const excludedNurseNames = visit.excludedNurseNames || [];
              const targetStart = parseTime(visit.startTime);
              const isAM = targetStart < 12 * 60;
              const dur = visit.duration || 30;

              const isExcluded = (nurseName) => {
                  if (!nurseName || excludedNurseNames.length === 0) return false;
                  return excludedNurseNames.some(ex => nurseName.includes(ex) || ex.includes(nurseName));
              };
              
              for (const prefName of preferredNurseNames) {
                  if (!prefName) continue;
                  const prefNurseObj = availableStates.find(({nurse: n}) => (n.name === prefName || n.name?.includes(prefName) || prefName.includes(n.name)) && !isExcluded(n.name));
                  if (prefNurseObj) {
                      const s = states.find(st => st.id === prefNurseObj.nurse.id);
                      if (s && targetStart >= s.startTimeMin && (targetStart + dur) <= s.endTimeMin) {
                          best = s;
                          break;
                      }
                  }
              }
              
              if (!best) {
                let minTravel = Infinity;
                let minTotalDur = Infinity;
                let minBalance = Infinity;
                states.forEach(s => {
                  const nDef = availableStates.find(av => av.nurse.id === s.id)?.nurse;
                  if (!nDef) return;
                  if (isExcluded(nDef.name)) return;
                  if (nDef.isLowPriority) return; 
                  if (requiresFemale && !nDef.isFemale) return; 
                  
                  const dist = Math.sqrt(Math.pow((visit.location?.x || 50) - s.loc.x, 2) + Math.pow((visit.location?.y || 50) - s.loc.y, 2));
                  const travel = visit.customTravelTime ?? (baseTravelTime + Math.round(dist * 0.05));
                  const expectedEnd = Math.max(s.time + travel, targetStart) + dur;
                  
                  if (targetStart >= s.startTimeMin && s.time + travel <= targetStart && expectedEnd <= s.endTimeMin) {
                      const balanceScore = isAM ? (s.amDuration - s.pmDuration) : (s.pmDuration - s.amDuration);
                      if (s.totalDuration < minTotalDur || 
                         (s.totalDuration === minTotalDur && balanceScore < minBalance) ||
                         (s.totalDuration === minTotalDur && balanceScore === minBalance && travel < minTravel)) {
                          minTotalDur = s.totalDuration;
                          minBalance = balanceScore;
                          minTravel = travel;
                          best = s;
                      }
                  }
                });
              }
              
              if (!best) {
                let minTravel = Infinity;
                let minTotalDur = Infinity;
                let minBalance = Infinity;
                states.forEach(s => {
                  const nDef = availableStates.find(av => av.nurse.id === s.id)?.nurse;
                  if (!nDef) return;
                  if (isExcluded(nDef.name)) return;
                  if (!nDef.isLowPriority) return; 
                  if (requiresFemale && !nDef.isFemale) return; 
                  
                  const dist = Math.sqrt(Math.pow((visit.location?.x || 50) - s.loc.x, 2) + Math.pow((visit.location?.y || 50) - s.loc.y, 2));
                  const travel = visit.customTravelTime ?? (baseTravelTime + Math.round(dist * 0.05));
                  const expectedEnd = Math.max(s.time + travel, targetStart) + dur;
                  
                  if (targetStart >= s.startTimeMin && s.time + travel <= targetStart && expectedEnd <= s.endTimeMin) {
                      const balanceScore = isAM ? (s.amDuration - s.pmDuration) : (s.pmDuration - s.amDuration);
                      if (s.totalDuration < minTotalDur || 
                         (s.totalDuration === minTotalDur && balanceScore < minBalance) ||
                         (s.totalDuration === minTotalDur && balanceScore === minBalance && travel < minTravel)) {
                          minTotalDur = s.totalDuration;
                          minBalance = balanceScore;
                          minTravel = travel;
                          best = s;
                      }
                  }
                });
              }
              
              if (!best) {
                 let earliest = Infinity;
                 let isBestLow = true;
                 let minTotalDur = Infinity;
                 let minBalance = Infinity;
                 states.forEach(s => {
                   const nDef = availableStates.find(av => av.nurse.id === s.id)?.nurse;
                   if (!nDef) return;
                   if (isExcluded(nDef.name)) return;
                   if (requiresFemale && !nDef.isFemale) return; 
                   const isLow = !!nDef.isLowPriority;
                   
                   const dist = Math.sqrt(Math.pow((visit.location?.x || 50) - s.loc.x, 2) + Math.pow((visit.location?.y || 50) - s.loc.y, 2));
                   const travel = visit.customTravelTime ?? (baseTravelTime + Math.round(dist * 0.05));
                   const arrival = s.time + travel;
                   const expectedEnd = Math.max(arrival, targetStart) + dur;
                   const balanceScore = isAM ? (s.amDuration - s.pmDuration) : (s.pmDuration - s.amDuration);
                   
                   if (targetStart >= s.startTimeMin && expectedEnd <= s.endTimeMin) {
                       if (arrival < earliest || 
                          (arrival === earliest && isBestLow && !isLow) ||
                          (arrival === earliest && isBestLow === isLow && s.totalDuration < minTotalDur) ||
                          (arrival === earliest && isBestLow === isLow && s.totalDuration === minTotalDur && balanceScore < minBalance)) { 
                           earliest = arrival; 
                           best = s; 
                           isBestLow = isLow;
                           minTotalDur = s.totalDuration;
                           minBalance = balanceScore;
                       }
                   }
                 });
              }
              
              if (!best) {
                 let earliest = Infinity;
                 let isBestLow = true;
                 let minTotalDur = Infinity;
                 let minBalance = Infinity;
                 states.forEach(s => {
                   const nDef = availableStates.find(av => av.nurse.id === s.id)?.nurse;
                   if (!nDef) return;
                   if (isExcluded(nDef.name)) return;
                   if (requiresFemale && !nDef.isFemale) return; 
                   const isLow = !!nDef.isLowPriority;
                   
                   const dist = Math.sqrt(Math.pow((visit.location?.x || 50) - s.loc.x, 2) + Math.pow((visit.location?.y || 50) - s.loc.y, 2));
                   const travel = visit.customTravelTime ?? (baseTravelTime + Math.round(dist * 0.05));
                   const arrival = s.time + travel;
                   const balanceScore = isAM ? (s.amDuration - s.pmDuration) : (s.pmDuration - s.amDuration);
                   
                   if (targetStart >= s.startTimeMin) {
                       if (arrival < earliest || 
                          (arrival === earliest && isBestLow && !isLow) ||
                          (arrival === earliest && isBestLow === isLow && s.totalDuration < minTotalDur) ||
                          (arrival === earliest && isBestLow === isLow && s.totalDuration === minTotalDur && balanceScore < minBalance)) { 
                           earliest = arrival; 
                           best = s; 
                           isBestLow = isLow;
                           minTotalDur = s.totalDuration;
                           minBalance = balanceScore;
                       }
                   }
                 });
              }

              if (best) {
                const vIdx = newVisits.findIndex(v => v.id === visit.id);
                newVisits[vIdx].nurseId = best.id;
                const dist = Math.sqrt(Math.pow((visit.location?.x || 50) - best.loc.x, 2) + Math.pow((visit.location?.y || 50) - best.loc.y, 2));
                const travel = visit.customTravelTime ?? (baseTravelTime + Math.round(dist * 0.05));
                
                best.time = Math.max(best.time + travel, parseTime(visit.startTime)) + dur;
                best.loc = visit.location || {x: 50, y: 50};
                best.totalDuration += dur;
                if (isAM) {
                    best.amDuration += dur;
                } else {
                    best.pmDuration += dur;
                }
                best.visitCount++;
                assignedCount++;
              }
            });
            
            handleSetVisits(newVisits); 
            setIsOptimizing(false); 
            if(assignedCount === 0) {
              setToastMessage("自動編成できる対象がありませんでした");
            } else {
              setToastMessage("自動編成完了"); 
            }
            setShowToast(true);
          } catch (error) {
            console.error("AutoAssign Error:", error);
            setIsOptimizing(false);
            setToastMessage("自動編成中にエラーが発生しました。");
            setShowToast(true);
          }
        }, 800);
      };

      const executeResetAssignments = () => {
        if (!isAdmin) return;
        saveHistory();
        handleSetVisits(prev => prev.map(v => {
          if (v.date === selectedDate && !v.isExcludedFromAutoAssign) {
            return {
              ...v,
              nurseId: null,
              startTime: v.originalStartTime || v.startTime,
              customTravelTime: null
            };
          }
          return v;
        }));
        setShowResetConfirm(false);
        setToastMessage("固定された予定を除き、リセットしました");
        setShowToast(true);
      };

      const handleHorizontalScroll = (e) => {
        if (e.deltaY !== 0 && !e.shiftKey) {
          const el = e.currentTarget;
          const isAtLeft = el.scrollLeft <= 0 && e.deltaY < 0;
          const isAtRight = Math.ceil(el.scrollLeft + el.clientWidth) >= el.scrollWidth && e.deltaY > 0;
          if (!isAtLeft && !isAtRight) {
            e.preventDefault();
            el.scrollLeft += e.deltaY;
          }
        }
      };

      const handleDrop = (e, targetNurseId) => {
        if (!isAdmin) return;
        e.preventDefault();
        const visitId = parseInt(e.dataTransfer.getData('text/plain'), 10);
        if (isNaN(visitId)) return;
        
        const targetVisit = visits.find(v => v.id === visitId);
        
        if (targetVisit && targetVisit.isExcludedFromAutoAssign) {
            return;
        }

        let newStartTimeStr = targetVisit.startTime;
        const targetStartMin = parseTime(targetVisit.startTime);

        const offsetY = parseFloat(e.dataTransfer.getData('offsetY') || 0);
        const rect = e.currentTarget.getBoundingClientRect();
        const y = (e.clientY - rect.top) - offsetY;
        const minutes = y / PIXELS_PER_MINUTE + START_HOUR * 60;
        const snappedMinutes = Math.round(minutes / 15) * 15; 
        newStartTimeStr = formatTime(Math.max(START_HOUR * 60, Math.min(END_HOUR * 60 - 15, snappedMinutes)));
        const newStartMin = parseTime(newStartTimeStr);

        if (targetNurseId) {
            const targetNurse = nurses.find(n => n.id === targetNurseId);
            
            if (targetVisit.requiresFemaleNurse && !targetNurse.isFemale) {
                setToastMessage("この利用者は女性看護師限定です");
                setShowToast(true);
                return;
            }

            if (targetVisit.excludedNurseNames && targetVisit.excludedNurseNames.length > 0) {
                const isExcluded = targetVisit.excludedNurseNames.some(ex => targetNurse.name.includes(ex) || ex.includes(targetNurse.name));
                if (isExcluded) {
                    setToastMessage("除外スタッフに設定されているため、割り当てできません");
                    setShowToast(true);
                    return;
                }
            }

            const offType = getIsNurseOffType(targetNurse, selectedDate, nurseStatuses);
            if (offType === 'full') {
                setToastMessage(`${targetNurse.name} は本日お休みです`);
                setShowToast(true);
                return;
            }
            if (offType === 'AM' && newStartMin < parseTime('13:30')) {
                setToastMessage(`${targetNurse.name} は午前休（13:30以降出勤）です`);
                setShowToast(true);
                return;
            }
            if (offType === 'PM' && newStartMin >= parseTime('12:30')) {
                setToastMessage(`${targetNurse.name} は午後休（12:30退勤）です`);
                setShowToast(true);
                return;
            }
        }
        
        saveHistory();
        handleSetVisits(prev => prev.map(v => {
          if (v.id === visitId) {
             const original = v.originalStartTime || v.startTime;
             return { ...v, nurseId: targetNurseId, startTime: newStartTimeStr, originalStartTime: original, date: selectedDate };
          }
          return v;
        }));
      };

      const updateVisitNurse = (visitId, newNurseId) => {

            const targetNurse = nurses.find(n => n.id === parsedNurseId);

                setShowToast(true);
                return;
            }
            
            if (targetVisit.excludedNurseNames && targetVisit.excludedNurseNames.length > 0) {

                if (isExcluded) {
                    setToastMessage("除外スタッフに設定されているため、割り当てできません");
                    setShowToast(true);
                    return;
                }
            }

                setToastMessage(`${targetNurse.name} は本日お休みです`);
                setShowToast(true);

      const updateCustomTravelTime = (visitId, newTime) => {
        if (!isAdmin) return;
        handleSetVisits(prev => prev.map(v => v.id === visitId ? { ...v, customTravelTime: newTime } : v));
      };

      const handleAddEvent = (e) => {

        const formData = new FormData(e.target);
        const title = formData.get('title');
        const startTime = formData.get('startTime');
        const duration = parseInt(formData.get('duration'), 10);
        const nurseIdStr = formData.get('nurseId');

          userName: title,
          type: 'other',

      const handleFetchSheet = async () => {
        if (!isAdmin) return;
        setIsLoadingSheet(true);
        try {
          const res = await fetch(sheetUrl);
          const txt = await res.text();
          const rows = txt.split(/\r\n|\n/);
          const dayMap = { '日': 0, '月': 1, '火': 2, '水': 3, '木': 4, '金': 5, '土': 6 };
          const result = [];
          
          for (let i = 1; i < rows.length; i++) {
            const p = rows[i].split(',');
            if (p[9] && p[9].includes('休止')) continue; 
            if (p[0]?.trim()) {
              const nameStr = p[0].trim();
              const dateOrDay = p[1]?.trim() || '';
              let st = p[2]?.trim() || '09:00'; if (st.length === 4) st = '0' + st;
              const dur = parseInt(p[3]) || 30;
              const requiresFemale = p[4] ? p[4].includes('女性') : false;
              
              const prefNurse1 = p[5]?.trim() || null;
              const prefNurse2 = p[6]?.trim() || null;
              const preferredNames = [prefNurse1, prefNurse2].filter(Boolean);
              
              const excludedNursesStr = p[7]?.trim() || '';
              const excludedNurseNames = excludedNursesStr ? excludedNursesStr.split(/[・,、]/).map(n => n.trim()).filter(Boolean) : [];

              const address = p[8]?.trim() || '';

              let visitDate = '';
              if (dateOrDay.includes('/') || dateOrDay.includes('-')) {
                visitDate = dateOrDay.replace(/\//g, '-');
              } else {
                const targetDay = dayMap[dateOrDay];
                if (targetDay !== undefined && startDate) {
                  const start = new Date(startDate);
                  const startDay = start.getDay();
                  let diff = targetDay - startDay;
                  if (diff < 0) diff += 7;
                  start.setDate(start.getDate() + diff);
                  visitDate = start.toISOString().split('T')[0];
                } else {
                  visitDate = startDate || new Date().toISOString().split('T')[0];
                }
              }

              result.push({ 
                id: Date.now() + i, 
                userName: nameStr.includes('様') ? nameStr : nameStr + ' 様', 
                location: getHashLoc(address || nameStr), 
                duration: dur, 
                date: visitDate, 
                dayOfWeek: dayMap[dateOrDay] ?? 1, 
                startTime: st, 
                originalStartTime: st, 
                nurseId: null,
                requiresFemaleNurse: requiresFemale,
                preferredNurseNames: preferredNames,
                excludedNurseNames: excludedNurseNames,
                address: address,
                isExcludedFromAutoAssign: false,
                isAccompany: false
              });
            }

              nextVisits.push({ 
                ...sheetData, 
                id: v.id, 
                nurseId: v.nurseId, 
                startTime: v.startTime, 
                customTravelTime: v.customTravelTime,
                isExcludedFromAutoAssign: v.isExcludedFromAutoAssign 
              });
              updatedCount++;
            } else {
              deletedCount++;
            }
          });

          result.forEach(nv => {
            const isExisting = visits.some(v => 
              v.type !== 'other' && !v.isAccompany &&
              normalizeName(v.userName) === normalizeName(nv.userName) && 
              v.date === nv.date && 
              v.originalStartTime === nv.originalStartTime
            );
            
            if (!isExisting) {
              nextVisits.push(nv);
              addedCount++;
            }
          });
          
          handleSetVisits(nextVisits); 
          setToastMessage(`同期完了: 新規追加 ${addedCount}件 / 更新 ${updatedCount}件 / 削除 ${deletedCount}件`); 
          setShowToast(true);
        } catch (e) { setToastMessage("データの同期に失敗"); setShowToast(true); } 
        finally { setIsLoadingSheet(false); }
      };

      const handleFetchNurseSheet = async () => {
        if (!isAdmin) return;
        setIsLoadingNurseSheet(true);
        try {
          const res = await fetch(nurseSheetUrl);
          const txt = await res.text();
          const rows = txt.split(/\r\n|\n/);
          const dayMap = { '日': 0, '月': 1, '火': 2, '水': 3, '木': 4, '金': 5, '土': 6 };
          const result = [];
          
          for (let i = 1; i < rows.length; i++) {
            const p = rows[i].split(',');
            if (p[0]?.trim()) {
              const nameStr = p[0].trim();
              let st = p[1]?.trim() || '08:30'; if (st.length === 4) st = '0' + st;
              let et = p[2]?.trim() || '17:30'; if (et.length === 4) et = '0' + et;
              
              let off = []; 
              if (p[3]) {
                  const rawOffs = p[3].split(/[・,、]/).map(d => d.trim()).filter(Boolean);

                     let type = 'full';
                     let dayStr = rawOff;
                     if (rawOff.includes('(午前)') || rawOff.includes('(AM)')) { type = 'AM'; dayStr = rawOff.replace(/\(午前\)/g, '').replace(/\(AM\)/g, ''); }
                     else if (rawOff.includes('(午後)') || rawOff.includes('(PM)')) { type = 'PM'; dayStr = rawOff.replace(/\(午後\)/g, '').replace(/\(PM\)/g, ''); }
                     
                     if (dayMap[dayStr] !== undefined) {
                         off.push({ day: dayMap[dayStr], type });
                     }
                  });
              }
              
              const isLow = p[4] ? p[4].includes('低') : false;
              const isFemale = p[5] ? p[5].includes('女性') : false;
              
              let specificOffDays = [];
              if (p[6]) {
                 const rawSpecs = p[6].split(/[・,、]/).map(d => d.trim()).filter(Boolean);
                 rawSpecs.forEach(rawSpec => {
                     let type = 'full';
                     let dateStr = rawSpec;
                     if (rawSpec.includes('(午前)') || rawSpec.includes('(AM)')) { type = 'AM'; dateStr = rawSpec.replace(/\(午前\)/g, '').replace(/\(AM\)/g, ''); }
                     else if (rawSpec.includes('(午後)') || rawSpec.includes('(PM)')) { type = 'PM'; dateStr = rawSpec.replace(/\(午後\)/g, '').replace(/\(PM\)/g, ''); }
                     dateStr = dateStr.replace(/\//g, '-'); 
                     
                     const dateParts = dateStr.split('-');
                     if(dateParts.length === 3) {
                         const y = dateParts[0];
                         const m = dateParts[1].padStart(2, '0');
                         const d = dateParts[2].padStart(2, '0');
                         dateStr = `${y}-${m}-${d}`;
                     }

                     if (dateStr) {
                         specificOffDays.push({ date: dateStr, type });
                     }
                 });
              }

              const address = p[7]?.trim() || '';
              
              result.push({ 
                id: Date.now() + i, 
                name: nameStr, 
                startLocation: getHashLoc(address || nameStr), 
                color: colors[result.length % colors.length], 
                startTime: st, 
                endTime: et,
                offDays: off, 
                specificOffDays: specificOffDays,
                isLowPriority: isLow,
                isFemale: isFemale

            }

            }

              valA = nA ? nA.name : '未指定'; 
              valB = nB ? nB.name : '未指定';
              
              if (valA === valB) {
                return parseTime(a.startTime) - parseTime(b.startTime);
              }
            } else { 
              valA = a[visitSortConfig.key]; 
              valB = b[visitSortConfig.key]; 
            }
            if (valA < valB) return visitSortConfig.direction === 'asc' ? -1 : 1;

                  </a>
                ) : (
                  <div className={`w-full text-left px-4 py-3 text-sm font-bold text-slate-400 flex items-center gap-3 ${isAdmin ? 'border-t border-slate-100' : ''}`}>
                    <MapPin size={16} className="text-slate-300" />住所未登録
                  </div>
                )}
              </div>
            </div>
          )}

          {editingVisit && (
            <div className="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm px-4">
              <div className="bg-white rounded-[2rem] p-8 max-w-md w-full shadow-2xl">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-2xl font-black text-slate-800">予定の編集</h3>
                  <button onClick={() => setEditingVisit(null)} className="text-slate-400 hover:text-slate-600 bg-slate-100 p-2 rounded-full"><X size={20} /></button>
                </div>
                <form onSubmit={handleSaveEdit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-500 mb-1">名称 / 氏名</label>
                    <input required type="text" name="userName" defaultValue={editingVisit.userName} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-teal-500 font-bold" />
                  </div>
                  <div className="flex gap-4">
                    <div className="flex-1">
                      <label className="block text-xs font-bold text-slate-500 mb-1">開始時間</label>
                      <input required type="time" name="startTime" defaultValue={editingVisit.startTime} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-teal-500 font-bold" />
                    </div>
                    <div className="w-28">
                      <label className="block text-xs font-bold text-slate-500 mb-1">時間(分)</label>
                      <input required type="number" name="duration" defaultValue={editingVisit.duration} step="5" min="5" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-teal-500 font-bold" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-500 mb-1">コメント・連絡事項</label>
                    <textarea name="comment" defaultValue={editingVisit.comment || ''} rows="2" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-teal-500 font-bold resize-none" placeholder="引き継ぎ事項やメモなどを入力"></textarea>
                  </div>
                  <button type="submit" className="w-full mt-6 py-4 rounded-2xl font-black text-white bg-teal-600 hover:bg-teal-700 transition-colors shadow-lg shadow-teal-600/30">
                    保存する
                  </button>
                </form>
              </div>
            </div>
          )}

          {activePatternSlot && (
            <div className="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm px-4" onClick={() => setActivePatternSlot(null)}>
              <div className="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-xl font-black text-slate-800">メモリ {activePatternSlot}</h3>
                  <button onClick={() => setActivePatternSlot(null)} className="text-slate-400 hover:text-slate-600 bg-slate-100 p-2 rounded-full"><X size={20} /></button>
                </div>
                <div className="space-y-3">
                  <button 
                    onClick={() => {
                      savePattern(activePatternSlot);
                      setActivePatternSlot(null);
                    }}
                    className="w-full py-4 rounded-2xl font-black text-teal-700 bg-teal-50 hover:bg-teal-100 border border-teal-200 transition-colors flex items-center justify-center gap-2"
                  >
                    <Upload size={18} />
                    現在の状態を保存
                  </button>
                  
                  <button 
                    onClick={() => {
                      loadPattern(activePatternSlot);
                      setActivePatternSlot(null);
                    }}
                    disabled={!savedPatterns[selectedDate]?.[activePatternSlot]}
                    className="w-full py-4 rounded-2xl font-black text-indigo-700 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                  >
                    <RefreshCw size={18} />
                    保存した状態を復元
                  </button>

                  <button 
                    onClick={() => {
                      deletePattern(activePatternSlot);
                      setActivePatternSlot(null);
                    }}
                    disabled={!savedPatterns[selectedDate]?.[activePatternSlot]}
                    className="w-full py-4 rounded-2xl font-black text-red-600 bg-red-50 hover:bg-red-100 border border-red-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                  >
                    <Trash2 size={18} />
                    メモリを削除
                  </button>
                </div>
              </div>
            </div>
          )}

          {showAddEventModal && (
            <div className="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm px-4">
              <div className="bg-white rounded-[2rem] p-8 max-w-md w-full shadow-2xl">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-2xl font-black text-slate-800">予定を追加</h3>
                  <button onClick={() => setShowAddEventModal(false)} className="text-slate-400 hover:text-slate-600 bg-slate-100 p-2 rounded-full"><X size={20} /></button>
                </div>
                <form onSubmit={handleAddEvent} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-500 mb-1">タイトル (会議・研修など)</label>
                    <input required type="text" name="title" ref={addEventTitleInputRef} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-teal-500 font-bold" />
                  </div>
                  <div className="flex gap-4">
                    <div className="flex-1">
                      <label className="block text-xs font-bold text-slate-500 mb-1">開始時間</label>
                      <input required type="time" name="startTime" defaultValue="12:00" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-teal-500 font-bold" />
                    </div>
                    <div className="w-28">
                      <label className="block text-xs font-bold text-slate-500 mb-1">時間(分)</label>
                      <input required type="number" name="duration" defaultValue="30" step="5" min="5" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-teal-500 font-bold" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-500 mb-1">担当者</label>
                    <select name="nurseId" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-teal-500 font-bold">
                      <option value="unassigned">未割り当て</option>
                      <option value="all">全員 (出勤中の全員に追加)</option>
                      {nurses.map(n => <option key={n.id} value={n.id}>{n.name}</option>)}
                    </select>
                  </div>
                  <div className="flex items-center gap-2 mt-4 bg-red-50 p-3 rounded-xl border border-red-100">
                     <input type="checkbox" id="lockEvent" name="isLocked" className="w-4 h-4 text-teal-600 rounded border-slate-300 focus:ring-teal-500" />
                     <label htmlFor="lockEvent" className="text-sm font-bold text-red-600">自動編成から除外（時間を固定する）</label>
                  </div>
                  <button type="submit" className="w-full mt-6 py-4 rounded-2xl font-black text-white bg-teal-600 hover:bg-teal-700 transition-colors shadow-lg shadow-teal-600/30">
                    追加する
                  </button>
                </form>
              </div>
            </div>
          )}

          {deleteConfirmId && (
            <div className="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm px-4">
              <div className="bg-white rounded-[2rem] p-8 max-w-md w-full shadow-2xl">
                <div className="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mb-6 mx-auto">
                  <Trash2 size={32} />
                </div>
                <h3 className="text-2xl font-black text-slate-800 text-center mb-2">予定の削除</h3>
                <p className="text-sm font-bold text-slate-500 text-center mb-8 leading-relaxed">
                  この予定を削除しますか？<br/>
                  <span className="text-xs text-red-500">※スプレッドシートの訪問予定の場合は、再度同期すると復活します。</span>
                </p>
                <div className="flex gap-4">
                  <button onClick={() => setDeleteConfirmId(null)} className="flex-1 py-4 rounded-2xl font-black text-slate-500 bg-slate-100 hover:bg-slate-200 transition-colors">キャンセル</button>
                  <button onClick={() => {
                     saveHistory();
                     handleSetVisits(prev => prev.filter(v => v.id !== deleteConfirmId));
                     setDeleteConfirmId(null);
                     setToastMessage("予定を削除しました");
                     setShowToast(true);
                  }} className="flex-1 py-4 rounded-2xl font-black text-white bg-red-500 hover:bg-red-600 transition-colors shadow-lg shadow-red-500/30">削除する</button>
                </div>
              </div>
            </div>
          )}

          {showResetConfirm && (
            <div className="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm px-4">
              <div className="bg-white rounded-[2rem] p-8 max-w-md w-full shadow-2xl">
                <div className="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mb-6 mx-auto">
                  <AlertTriangle size={32} />
                </div>
                <h3 className="text-2xl font-black text-slate-800 text-center mb-2">割り当てをリセット</h3>
                <p className="text-sm font-bold text-slate-500 text-center mb-8 leading-relaxed">
                  {formatDateLabel(selectedDate)} の割り当てを解除し、未割り当てに戻します。<br/>
                  <span className="text-red-500 font-black text-xs">※固定（ロック）されている予定は残ります</span>
                </p>
                <div className="flex gap-4">
                  <button onClick={() => setShowResetConfirm(false)} className="flex-1 py-4 rounded-2xl font-black text-slate-500 bg-slate-100 hover:bg-slate-200 transition-colors">キャンセル</button>
                  <button onClick={executeResetAssignments} className="flex-1 py-4 rounded-2xl font-black text-white bg-red-500 hover:bg-red-600 transition-colors shadow-lg shadow-red-500/30">リセットする</button>
                </div>
              </div>
            </div>
          )}

          {showToast && (
            <div onClick={() => setShowToast(false)} className="fixed bottom-6 right-6 md:bottom-10 md:right-10 glass-effect text-slate-900 px-6 py-4 md:px-8 md:py-5 rounded-[1.5rem] md:rounded-[2rem] shadow-2xl flex items-center gap-3 md:gap-4 animate-bounce z-[100] border border-white shadow-teal-500/20 cursor-pointer max-w-[90vw]">
              <div className="bg-emerald-500 p-1.5 md:p-2 rounded-lg md:rounded-xl text-white shadow-lg shadow-emerald-200 shrink-0">
                <CheckCircle2 size={20} className="md:w-6 md:h-6" />
              </div>
              <span className="font-black text-xs md:text-sm tracking-tight">{toastMessage}</span>
            </div>
          )}
          
          {seasonalEffect && (
            <div className="fixed bottom-24 right-6 md:bottom-28 md:right-10 z-[90] animate-[bounce_3s_infinite] pointer-events-none flex flex-col items-center transition-all duration-500 hover:scale-110">
              <div className="text-4xl md:text-5xl drop-shadow-2xl">{seasonalEffect.icon}</div>
              <div className="text-[10px] font-black text-slate-600 bg-white/90 border border-slate-200 px-3 py-1 rounded-full mt-2 shadow-lg backdrop-blur-sm whitespace-nowrap">
                {seasonalEffect.text}
              </div>
            </div>
          )}
        </div>
      );
    }
    
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
